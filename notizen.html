<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notizen | NeoStudy</title>
    <link rel="stylesheet" href="css/style.css?v=10">
    <style>
        /* ===================== NOTIZEN PAGE ===================== */
        .nz-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 1.2rem; align-items: start; }
        @media (max-width: 780px) { .nz-wrap { grid-template-columns: 1fr; } }

        /* ---- Sidebar ---- */
        .nz-side { display: flex; flex-direction: column; gap: 0.8rem; }
        .nz-newbtn {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%; padding: 0.8rem 1rem; cursor: pointer;
            background: linear-gradient(135deg, #f472b6, #c084fc);
            color: #fff; border: none; border-radius: var(--radius-md);
            font-family: var(--font-main); font-weight: 800; font-size: 0.95rem;
            box-shadow: 0 6px 18px rgba(244,114,182,0.28); transition: transform .12s, box-shadow .12s;
        }
        .nz-newbtn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(244,114,182,0.4); }
        .nz-newbtn span.plus { font-size: 1.2rem; line-height: 1; }

        .nz-search-wrap { position: relative; }
        .nz-search-wrap .ico { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); opacity: .45; font-size: .9rem; pointer-events: none; }
        .nz-side .search-input { padding: 0.6rem 0.8rem 0.6rem 2.3rem; font-size: 0.9rem; }

        .nz-filter { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .nz-chip {
            padding: 0.28rem 0.7rem; border-radius: 20px; cursor: pointer; font-size: 0.75rem; font-weight: 700;
            background: var(--color-bg-card); border: 1px solid var(--color-border); color: var(--color-text-secondary);
            transition: all .15s;
        }
        .nz-chip:hover { border-color: var(--color-border-hover); color: var(--color-text); }
        .nz-chip.active { background: var(--color-accent-subtle); border-color: var(--color-accent); color: var(--color-accent); }

        .nz-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 60vh; overflow-y: auto; padding-right: 2px; }
        .nz-list::-webkit-scrollbar { width: 6px; }
        .nz-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 6px; }
        .nz-item {
            padding: 0.7rem 0.85rem; border-radius: var(--radius-md); cursor: pointer;
            background: var(--color-bg-card); border: 1px solid var(--color-border);
            transition: all .15s; position: relative;
        }
        .nz-item:hover { background: var(--color-bg-card-hover); border-color: var(--color-border-hover); }
        .nz-item.active { border-color: var(--color-accent); background: var(--color-accent-subtle); }
        .nz-item h4 { font-size: 0.92rem; font-weight: 800; color: var(--color-text); margin: 0 0 0.2rem; font-family: var(--font-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nz-item .prev { font-size: 0.76rem; color: var(--color-text-muted); line-height: 1.35; max-height: 2.7em; overflow: hidden; }
        .nz-item .meta { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.4rem; font-size: 0.68rem; color: var(--color-text-muted); }
        .nz-badge { padding: 0.1rem 0.5rem; border-radius: 10px; background: rgba(192,132,252,0.15); color: #d8b4fe; font-weight: 700; }
        .nz-empty-list { text-align: center; color: var(--color-text-muted); font-size: 0.82rem; padding: 1.5rem 0.5rem; }

        /* ---- Detail pane ---- */
        .nz-detail { min-height: 480px; padding: 1.3rem 1.4rem; border-radius: var(--radius-lg); }
        .nz-detail.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--color-text-muted); gap: 0.6rem; }
        .nz-detail.empty .big { font-size: 3rem; opacity: .5; }

        .nz-tabs { display: flex; gap: 0.35rem; margin-bottom: 1.1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.6rem; flex-wrap: wrap; }
        .nz-tab {
            padding: 0.5rem 1rem; cursor: pointer; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.86rem;
            color: var(--color-text-secondary); background: transparent; border: 1px solid transparent; transition: all .15s;
        }
        .nz-tab:hover { color: var(--color-text); background: var(--color-bg-card); }
        .nz-tab.active { color: var(--color-accent); background: var(--color-accent-subtle); border-color: var(--color-accent); }
        .nz-tab .cnt { opacity: .6; font-weight: 800; margin-left: 0.15rem; }

        .nz-detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.4rem; }
        .nz-icon-btn {
            background: var(--color-bg-card); border: 1px solid var(--color-border); color: var(--color-text-secondary);
            width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.95rem; transition: all .15s; flex: 0 0 auto;
        }
        .nz-icon-btn:hover { color: var(--color-red); border-color: var(--color-red); background: var(--color-red-subtle); }

        .nz-title-input {
            width: 100%; background: transparent; border: none; color: var(--color-text); font-family: var(--font-display);
            font-size: 1.5rem; font-weight: 700; padding: 0.2rem 0; outline: none; border-bottom: 1px solid transparent; transition: border .15s;
        }
        .nz-title-input:focus { border-bottom-color: var(--color-accent); }
        .nz-subject-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.6rem 0 1rem; }
        .nz-subject-row label { font-size: 0.78rem; color: var(--color-text-muted); }
        .nz-subject-input {
            background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text);
            border-radius: 20px; padding: 0.3rem 0.8rem; font-size: 0.8rem; font-family: var(--font-main); outline: none; max-width: 220px;
        }
        .nz-subject-input:focus { border-color: var(--color-accent); }

        .nz-body {
            width: 100%; min-height: 320px; resize: vertical; background: var(--color-bg-elevated);
            border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text);
            font-family: var(--font-main); font-size: 0.98rem; line-height: 1.7; padding: 1rem; outline: none;
        }
        .nz-body:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-subtle); }
        .nz-hint { font-size: 0.76rem; color: var(--color-text-muted); margin-top: 0.5rem; }
        .nz-hint code { background: var(--color-bg-elevated); padding: 0.1rem 0.4rem; border-radius: 4px; color: #d8b4fe; font-size: 0.85em; }
        .nz-saved { font-size: 0.72rem; color: var(--color-green); opacity: 0; transition: opacity .3s; }
        .nz-saved.show { opacity: 1; }

        /* ---- Buttons row ---- */
        .nz-btnrow { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; }
        .nz-btn {
            padding: 0.55rem 1rem; border-radius: var(--radius-sm); cursor: pointer; font-weight: 700; font-size: 0.84rem;
            font-family: var(--font-main); border: 1px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text);
            transition: all .15s;
        }
        .nz-btn:hover { border-color: var(--color-border-hover); background: var(--color-bg-card-hover); }
        .nz-btn.accent { background: var(--color-accent-subtle); border-color: var(--color-accent); color: var(--color-accent); }
        .nz-btn.accent:hover { background: rgba(244,114,182,0.2); }
        .nz-btn.solid { background: linear-gradient(135deg, #f472b6, #c084fc); border: none; color: #fff; box-shadow: 0 4px 14px rgba(244,114,182,0.25); }
        .nz-btn.solid:hover { transform: translateY(-1px); }
        .nz-btn:disabled { opacity: .4; cursor: not-allowed; }

        /* ---- Flashcards grid ---- */
        .nz-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.7rem; }
        .nz-card-mini {
            background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md);
            padding: 0.7rem 0.8rem; position: relative; transition: border .15s;
        }
        .nz-card-mini:hover { border-color: var(--color-border-hover); }
        .nz-card-mini.known { border-color: rgba(63,185,80,0.5); background: rgba(63,185,80,0.06); }
        .nz-card-mini .front { font-weight: 800; color: var(--color-text); font-size: 0.9rem; margin-bottom: 0.3rem; }
        .nz-card-mini .back { color: var(--color-text-secondary); font-size: 0.82rem; line-height: 1.4; }
        .nz-card-mini .del { position: absolute; top: 0.4rem; right: 0.5rem; cursor: pointer; color: var(--color-text-muted); font-size: 0.85rem; opacity: 0; transition: opacity .15s; }
        .nz-card-mini:hover .del { opacity: 1; }
        .nz-card-mini .del:hover { color: var(--color-red); }
        .nz-card-mini .known-dot { position: absolute; bottom: 0.5rem; right: 0.55rem; font-size: 0.7rem; color: var(--color-green); }

        .nz-add-card { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .nz-add-card input {
            flex: 1; min-width: 120px; background: var(--color-bg-elevated); border: 1px solid var(--color-border);
            color: var(--color-text); border-radius: var(--radius-sm); padding: 0.5rem 0.7rem; font-family: var(--font-main); font-size: 0.85rem; outline: none;
        }
        .nz-add-card input:focus { border-color: var(--color-accent); }

        /* ---- Study mode ---- */
        .nz-study { text-align: center; padding: 1rem 0; }
        .nz-study-progress { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 1rem; }
        .nz-progress-bar { height: 6px; background: var(--color-bg-elevated); border-radius: 6px; overflow: hidden; margin-bottom: 1.3rem; }
        .nz-progress-fill { height: 100%; background: linear-gradient(90deg, #f472b6, #c084fc); width: 0; transition: width .3s; }
        .nz-flip {
            perspective: 1200px; max-width: 460px; height: 250px; margin: 0 auto 1.4rem; cursor: pointer;
        }
        .nz-flip-inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
        .nz-flip.flipped .nz-flip-inner { transform: rotateY(180deg); }
        .nz-flip-face {
            position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius-lg);
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; text-align: center;
            border: 1px solid var(--color-border);
        }
        .nz-flip-front { background: var(--color-bg-elevated); }
        .nz-flip-front .lbl { font-size: 0.7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 0.8rem; }
        .nz-flip-front .txt { font-size: 1.4rem; font-weight: 800; color: var(--color-text); }
        .nz-flip-back { background: linear-gradient(135deg, rgba(244,114,182,0.12), rgba(192,132,252,0.12)); transform: rotateY(180deg); border-color: rgba(192,132,252,0.4); }
        .nz-flip-back .lbl { font-size: 0.7rem; letter-spacing: .1em; text-transform: uppercase; color: #d8b4fe; margin-bottom: 0.8rem; }
        .nz-flip-back .txt { font-size: 1.2rem; color: var(--color-text); line-height: 1.5; }
        .nz-tap-hint { font-size: 0.72rem; color: var(--color-text-muted); margin-top: 0.8rem; }
        .nz-study-actions { display: flex; gap: 0.7rem; justify-content: center; }
        .nz-study-actions .nz-btn { padding: 0.7rem 1.5rem; font-size: 0.9rem; }
        .nz-btn.again { border-color: var(--color-orange); color: var(--color-orange); background: var(--color-orange-subtle); }
        .nz-btn.good { border-color: var(--color-green); color: var(--color-green); background: var(--color-green-subtle); }
        .nz-study-done { text-align: center; padding: 2rem 1rem; }
        .nz-study-done .big { font-size: 3rem; margin-bottom: 0.5rem; }

        /* ---- Mindmap ---- */
        .nz-mm-toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.8rem; align-items: center; }
        .nz-mm-canvas {
            position: relative; height: 460px; border-radius: var(--radius-md); overflow: hidden;
            background: radial-gradient(circle at 50% 40%, rgba(192,132,252,0.06), transparent 60%), var(--color-bg-elevated);
            border: 1px solid var(--color-border); touch-action: none; user-select: none;
        }
        .nz-mm-canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .nz-mm-node {
            position: absolute; transform: translate(-50%, -50%); padding: 0.5rem 0.9rem; border-radius: 20px;
            background: var(--color-bg-card); border: 1px solid var(--color-border-hover); color: var(--color-text);
            font-size: 0.82rem; font-weight: 700; cursor: grab; max-width: 170px; text-align: center; line-height: 1.3;
            box-shadow: var(--shadow-card); white-space: pre-wrap; word-break: break-word;
        }
        .nz-mm-node:active { cursor: grabbing; }
        .nz-mm-node.root { background: linear-gradient(135deg, #f472b6, #c084fc); border: none; color: #fff; font-weight: 800; box-shadow: 0 6px 20px rgba(244,114,182,0.35); }
        .nz-mm-node.sel { outline: 2px solid var(--color-accent); outline-offset: 2px; }
        .nz-mm-node.connect-src { outline: 2px dashed #d8b4fe; outline-offset: 2px; }
        .nz-mm-hint { font-size: 0.74rem; color: var(--color-text-muted); margin-top: 0.5rem; }
        .nz-mm-canvas.connecting { cursor: crosshair; }
    </style>
</head>

    <script>
    (function () {
        "use strict";
        const LS_KEY = "neostudy_notizen_v1";
        const uid = () => "n" + Math.random().toString(36).slice(2, 9) + (performance.now() | 0).toString(36);
        const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        let state = { notes: [], activeId: null };
        let ui = { tab: "text", search: "", filter: "", study: null };

        /* ---------- persistence ---------- */
        /*
         * ======================= FERTIGE KONSPEKTE =======================
         * Diese Notizen werden von Claude aus einem Link/Foto erstellt und
         * hier eingetragen. Sie erscheinen automatisch für alle — ohne dass
         * du etwas tippen musst. Neue Konspekte kommen einfach unten dazu.
         * Jede Notiz braucht eine feste, EINDEUTIGE id ("builtin-...").
         * ================================================================= */
        const BUILTIN = [
            {
                id: "builtin-zhizn-igra", subject: "Мотивация", title: "Жизнь — игра: читкоды", builtin: true,
                updatedAt: 1751300000000,
                body: "Тематический конспект по видео «Если это всё игра — вот читкоды» (Anastasia Petrova). Это не дословная расшифровка, а ключевые идеи жанра «жизнь как игра / манифестация».\n\nГЛАВНАЯ ИДЕЯ: реальность — как игра. Ты не жертва обстоятельств, а игрок, который может менять «настройки». Внешний мир — следствие внутреннего состояния, а не наоборот.\n\nЧИТКОДЫ (правило — как работает):\nТы — источник — внешняя реальность отражает твоё внутреннее состояние, а не наоборот\nСостояние важнее действий — сначала «стань тем, у кого уже есть», и только потом действуй\nВнимание — валюта игры — на что направляешь фокус, то и растёт в твоей реальности\nБлагодарность — ускоряет получение и переключает тебя на ощущение «уже есть»\nОтпускание — перестань цепляться из нужды; желание из спокойствия исполняется легче\nСамоценность — базовый апгрейд: ценишь и любишь себя → поднимается «уровень» жизни\nЯзык мыслей — формулируй в настоящем времени и утвердительно: «я есть», а не «я хочу»\nНе верь глазам — текущая картинка это старые настройки; живи из желаемого состояния уже сейчас\nДействие из вдохновения — двигайся из интереса и лёгкости, а не из страха и «надо»\nИгра, а не выживание — играй с реальностью легко; серьёзность и напряжение тормозят результат\n\nВЫВОД: меняешь состояние и фокус внутри — меняется игра снаружи. «Читкод» — это не трюк, а привычка жить из желаемого, а не из нехватки.",
                cards: [
                    { id: "c-zi-1", front: "Ты — источник", back: "Внешняя реальность отражает твоё внутреннее состояние, а не наоборот", known: false },
                    { id: "c-zi-2", front: "Состояние важнее действий", back: "Сначала «стань тем, у кого уже есть», и только потом действуй", known: false },
                    { id: "c-zi-3", front: "Внимание — валюта игры", back: "На что направляешь фокус, то и растёт в твоей реальности", known: false },
                    { id: "c-zi-4", front: "Благодарность", back: "Ускоряет получение желаемого и переключает на ощущение «уже есть»", known: false },
                    { id: "c-zi-5", front: "Отпускание", back: "Перестань цепляться из нужды — из спокойствия исполняется легче", known: false },
                    { id: "c-zi-6", front: "Самоценность", back: "Базовый апгрейд: любишь и ценишь себя → поднимается «уровень» жизни", known: false },
                    { id: "c-zi-7", front: "Язык мыслей", back: "Формулируй в настоящем времени и утвердительно: «я есть», а не «я хочу»", known: false },
                    { id: "c-zi-8", front: "Не верь глазам", back: "Текущая картинка — старые настройки; живи из желаемого состояния уже сейчас", known: false },
                    { id: "c-zi-9", front: "Действие из вдохновения", back: "Двигайся из интереса и лёгкости, а не из страха и «надо»", known: false },
                    { id: "c-zi-10", front: "Игра, а не выживание", back: "Играй легко — серьёзность и напряжение тормозят результат", known: false }
                ],
                mind: {
                    nodes: [
                        { id: "root", text: "Жизнь — игра", x: 0.5, y: 0.14, root: true },
                        { id: "m-zi-1", text: "Ты — источник", x: 0.17, y: 0.42, root: false },
                        { id: "m-zi-2", text: "Состояние > действий", x: 0.5, y: 0.36, root: false },
                        { id: "m-zi-3", text: "Внимание = фокус", x: 0.83, y: 0.42, root: false },
                        { id: "m-zi-4", text: "Благодарность", x: 0.26, y: 0.74, root: false },
                        { id: "m-zi-5", text: "Отпускание", x: 0.55, y: 0.8, root: false },
                        { id: "m-zi-6", text: "Самоценность", x: 0.82, y: 0.72, root: false }
                    ],
                    edges: [
                        { a: "root", b: "m-zi-1" }, { a: "root", b: "m-zi-2" }, { a: "root", b: "m-zi-3" },
                        { a: "root", b: "m-zi-4" }, { a: "root", b: "m-zi-5" }, { a: "root", b: "m-zi-6" }
                    ]
                }
            },
            {
                id: "builtin-konjunktiv2", subject: "Deutsch", title: "Konjunktiv II", builtin: true,
                updatedAt: 1751200000000,
                body: "Der Konjunktiv II beschreibt Irreales, Höflichkeit und Wünsche.\n\nWichtige Kürzel zum Lernen (Begriff — Erklärung):\nwürde + Infinitiv — Ersatzform für die meisten Verben\nwäre — Konjunktiv II von \"sein\"\nhätte — Konjunktiv II von \"haben\"\nkönnte — Konjunktiv II von \"können\"\n\nBeispiel: An deiner Stelle würde ich früher losfahren.",
                cards: [
                    { id: "c-kj2-1", front: "wäre", back: "Konjunktiv II von \"sein\"", known: false },
                    { id: "c-kj2-2", front: "hätte", back: "Konjunktiv II von \"haben\"", known: false },
                    { id: "c-kj2-3", front: "könnte", back: "Konjunktiv II von \"können\"", known: false }
                ],
                mind: {
                    nodes: [
                        { id: "root", text: "Konjunktiv II", x: 0.5, y: 0.28, root: true },
                        { id: "m-kj2-1", text: "Höflichkeit", x: 0.24, y: 0.62, root: false },
                        { id: "m-kj2-2", text: "Irreales", x: 0.5, y: 0.72, root: false },
                        { id: "m-kj2-3", text: "Wünsche", x: 0.76, y: 0.62, root: false }
                    ],
                    edges: [
                        { a: "root", b: "m-kj2-1" }, { a: "root", b: "m-kj2-2" }, { a: "root", b: "m-kj2-3" }
                    ]
                }
            }
        ];

        function load() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) { state = JSON.parse(raw); }
            } catch (e) { state = { notes: [], activeId: null }; }
            if (!state.notes) state.notes = [];
            mergeBuiltins();
        }
        function save() {
            try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
        }
        // Fügt neue fertige Konspekte hinzu, ohne vorhandene (auch bearbeitete) zu überschreiben.
        function mergeBuiltins() {
            let added = false;
            BUILTIN.forEach(b => {
                if (!state.notes.some(n => n.id === b.id)) {
                    state.notes.push(JSON.parse(JSON.stringify(b)));
                    added = true;
                }
            });
            if (!state.activeId && state.notes.length) {
                state.activeId = state.notes.slice().sort((a, b) => b.updatedAt - a.updatedAt)[0].id;
            }
            if (added) save();
        }

        /* ---------- helpers ---------- */
        const activeNote = () => state.notes.find(n => n.id === state.activeId) || null;
        function touch(n) { n.updatedAt = Date.now(); save(); }
        function timeAgo(ts) {
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 60) return "gerade eben";
            if (s < 3600) return Math.floor(s / 60) + " Min.";
            if (s < 86400) return Math.floor(s / 3600) + " Std.";
            return Math.floor(s / 86400) + " T.";
        }

        /* ---------- sidebar ---------- */
        function renderSidebar() {
            // filter chips (subjects)
            const subjects = [...new Set(state.notes.map(n => (n.subject || "").trim()).filter(Boolean))];
            const fc = document.getElementById("nz-filter");
            let chips = `<div class="nz-chip ${ui.filter === "" ? "active" : ""}" data-f="">Alle</div>`;
            subjects.forEach(s => { chips += `<div class="nz-chip ${ui.filter === s ? "active" : ""}" data-f="${esc(s)}">${esc(s)}</div>`; });
            fc.innerHTML = subjects.length ? chips : "";

            const q = ui.search.toLowerCase();
            let notes = state.notes.slice().sort((a, b) => b.updatedAt - a.updatedAt);
            if (ui.filter) notes = notes.filter(n => (n.subject || "").trim() === ui.filter);
            if (q) notes = notes.filter(n => (n.title + " " + n.body + " " + (n.subject || "")).toLowerCase().includes(q));

            const list = document.getElementById("nz-list");
            if (notes.length === 0) {
                list.innerHTML = `<div class="nz-empty-list">${state.notes.length ? "Nichts gefunden." : "Noch keine Notizen."}</div>`;
                return;
            }
            list.innerHTML = notes.map(n => {
                const preview = (n.body || "").replace(/\s+/g, " ").trim().slice(0, 90) || "Leere Notiz…";
                const cardCount = (n.cards || []).length;
                return `<div class="nz-item ${n.id === state.activeId ? "active" : ""}" data-id="${n.id}">
                    <h4>${esc(n.title || "Ohne Titel")}</h4>
                    <div class="prev">${esc(preview)}</div>
                    <div class="meta">
                        ${n.subject ? `<span class="nz-badge">${esc(n.subject)}</span>` : ""}
                        <span>${cardCount ? "\u{1F0CF} " + cardCount : ""}</span>
                        <span style="margin-left:auto;">${timeAgo(n.updatedAt)}</span>
                    </div>
                </div>`;
            }).join("");
        }

        /* ---------- detail ---------- */
        function renderDetail() {
            const el = document.getElementById("nz-detail");
            const n = activeNote();
            if (!n) {
                el.classList.add("empty");
                el.innerHTML = `<div class="big">&#x1F4DD;</div><p>W&auml;hle links eine Notiz aus<br>oder erstelle eine neue.</p>`;
                return;
            }
            el.classList.remove("empty");
            const cardCount = (n.cards || []).length;
            el.innerHTML = `
                <div class="nz-detail-top">
                    <input class="nz-title-input" id="nz-title" value="${esc(n.title)}" placeholder="Titel der Notiz…">
                    <button class="nz-icon-btn" id="nz-del" title="Notiz löschen">&#x1F5D1;</button>
                </div>
                <div class="nz-subject-row">
                    <label>Fach:</label>
                    <input class="nz-subject-input" id="nz-subject" value="${esc(n.subject || "")}" placeholder="z.B. Deutsch" list="nz-subjects">
                    <datalist id="nz-subjects">${[...new Set(state.notes.map(x => x.subject).filter(Boolean))].map(s => `<option value="${esc(s)}">`).join("")}</datalist>
                    <span class="nz-saved" id="nz-saved">&#x2713; gespeichert</span>
                </div>
                <div class="nz-tabs">
                    <div class="nz-tab ${ui.tab === "text" ? "active" : ""}" data-tab="text">&#x1F4DD; Text</div>
                    <div class="nz-tab ${ui.tab === "cards" ? "active" : ""}" data-tab="cards">&#x1F0CF; Karten<span class="cnt">${cardCount ? " " + cardCount : ""}</span></div>
                    <div class="nz-tab ${ui.tab === "mind" ? "active" : ""}" data-tab="mind">&#x1F310; Mindmap</div>
                </div>
                <div id="nz-tabbody"></div>
            `;
            renderTab();
        }

        function flashSaved() {
            const s = document.getElementById("nz-saved");
            if (!s) return;
            s.classList.add("show");
            clearTimeout(flashSaved._t);
            flashSaved._t = setTimeout(() => s.classList.remove("show"), 1200);
        }

        function renderTab() {
            const body = document.getElementById("nz-tabbody");
            const n = activeNote();
            if (!body || !n) return;
            if (ui.tab === "text") renderText(body, n);
            else if (ui.tab === "cards") renderCards(body, n);
            else if (ui.tab === "mind") renderMind(body, n);
        }

        /* ---------- TEXT tab ---------- */
        function renderText(body, n) {
            body.innerHTML = `
                <textarea class="nz-body" id="nz-bodytext" placeholder="Schreib hier deine Notiz…">${esc(n.body || "")}</textarea>
                <div class="nz-hint">Tipp: Schreib Zeilen wie <code>Begriff — Erkl&auml;rung</code> (auch mit <code>-</code>, <code>:</code> oder <code>=</code>), dann kannst du im Tab &bdquo;Karten&ldquo; daraus Lernkarten erzeugen.</div>
            `;
            const ta = document.getElementById("nz-bodytext");
            ta.addEventListener("input", () => {
                n.body = ta.value; touch(n); flashSaved();
                clearTimeout(renderText._t);
                renderText._t = setTimeout(renderSidebar, 400);
            });
        }

        /* ---------- CARDS tab ---------- */
        function parseCards(text) {
            const out = [];
            (text || "").split("\n").forEach(line => {
                const m = line.match(/^\s*(.+?)\s*(?:—|–|→|->|::|[-:=])\s+(.+?)\s*$/);
                if (m && m[1] && m[2] && m[1].length <= 80) out.push({ front: m[1].trim(), back: m[2].trim() });
            });
            return out;
        }
        function renderCards(body, n) {
            if (ui.study) { renderStudy(body, n); return; }
            n.cards = n.cards || [];
            const parsed = parseCards(n.body);
            const existing = new Set(n.cards.map(c => c.front.toLowerCase()));
            const newFromText = parsed.filter(p => !existing.has(p.front.toLowerCase())).length;

            let html = `<div class="nz-btnrow">
                <button class="nz-btn accent" id="nz-gen" ${newFromText ? "" : "disabled"}>&#x2728; Aus Text erzeugen${newFromText ? " (" + newFromText + ")" : ""}</button>
                <button class="nz-btn solid" id="nz-study-start" ${n.cards.length ? "" : "disabled"}>&#x25B6; Lernen starten</button>
                ${n.cards.length ? `<button class="nz-btn" id="nz-reset-known">Fortschritt zur&uuml;cksetzen</button>` : ""}
            </div>
            <div class="nz-add-card">
                <input id="nz-cf" placeholder="Vorderseite (Begriff)">
                <input id="nz-cb" placeholder="Rückseite (Erklärung)">
                <button class="nz-btn" id="nz-add-card">&#43; Karte</button>
            </div>`;

            if (n.cards.length === 0) {
                html += `<div class="nz-empty-list" style="padding:2rem;">Noch keine Karten. Erzeuge welche aus deinem Text oder f&uuml;ge manuell hinzu.</div>`;
            } else {
                const known = n.cards.filter(c => c.known).length;
                html += `<div class="nz-hint" style="margin-bottom:0.7rem;">${n.cards.length} Karten &middot; ${known} gelernt</div>`;
                html += `<div class="nz-cards-grid">` + n.cards.map(c => `
                    <div class="nz-card-mini ${c.known ? "known" : ""}" data-cid="${c.id}">
                        <span class="del" data-del="${c.id}" title="Löschen">&#x2715;</span>
                        <div class="front">${esc(c.front)}</div>
                        <div class="back">${esc(c.back)}</div>
                        ${c.known ? `<span class="known-dot">&#x2713;</span>` : ""}
                    </div>`).join("") + `</div>`;
            }
            body.innerHTML = html;

            const genBtn = document.getElementById("nz-gen");
            if (genBtn) genBtn.onclick = () => {
                parsed.forEach(p => { if (!existing.has(p.front.toLowerCase())) { n.cards.push({ id: uid(), front: p.front, back: p.back, known: false }); existing.add(p.front.toLowerCase()); } });
                touch(n); renderTab(); renderSidebar();
            };
            const addBtn = document.getElementById("nz-add-card");
            if (addBtn) addBtn.onclick = () => {
                const f = document.getElementById("nz-cf"), b = document.getElementById("nz-cb");
                if (!f.value.trim() || !b.value.trim()) return;
                n.cards.push({ id: uid(), front: f.value.trim(), back: b.value.trim(), known: false });
                touch(n); renderTab(); renderSidebar();
            };
            const startBtn = document.getElementById("nz-study-start");
            if (startBtn) startBtn.onclick = () => startStudy(n);
            const resetBtn = document.getElementById("nz-reset-known");
            if (resetBtn) resetBtn.onclick = () => { n.cards.forEach(c => c.known = false); touch(n); renderTab(); };
            body.querySelectorAll("[data-del]").forEach(x => x.onclick = () => {
                n.cards = n.cards.filter(c => c.id !== x.dataset.del); touch(n); renderTab(); renderSidebar();
            });
        }

        /* ---------- STUDY mode ---------- */
        function startStudy(n) {
            const pool = n.cards.filter(c => !c.known);
            const deck = (pool.length ? pool : n.cards).slice();
            for (let i = deck.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [deck[i], deck[j]] = [deck[j], deck[i]]; }
            ui.study = { deck, idx: 0, flipped: false, total: deck.length, good: 0 };
            renderTab();
        }
        function renderStudy(body, n) {
            const st = ui.study;
            if (st.idx >= st.deck.length) {
                body.innerHTML = `<div class="nz-study-done">
                    <div class="big">&#x1F389;</div>
                    <h3 style="color:var(--color-text);">Runde fertig!</h3>
                    <p class="nz-hint" style="margin-bottom:1.2rem;">Gewusst: ${st.good} / ${st.total}</p>
                    <div class="nz-study-actions">
                        <button class="nz-btn solid" id="nz-again-all">Nochmal lernen</button>
                        <button class="nz-btn" id="nz-exit">Zur&uuml;ck zu den Karten</button>
                    </div>
                </div>`;
                document.getElementById("nz-again-all").onclick = () => startStudy(n);
                document.getElementById("nz-exit").onclick = () => { ui.study = null; renderTab(); renderSidebar(); };
                return;
            }
            const c = st.deck[st.idx];
            const pct = Math.round((st.idx / st.total) * 100);
            body.innerHTML = `
                <div class="nz-study">
                    <div class="nz-study-progress">Karte ${st.idx + 1} / ${st.total}</div>
                    <div class="nz-progress-bar"><div class="nz-progress-fill" style="width:${pct}%"></div></div>
                    <div class="nz-flip ${st.flipped ? "flipped" : ""}" id="nz-flip">
                        <div class="nz-flip-inner">
                            <div class="nz-flip-face nz-flip-front"><div class="lbl">Frage</div><div class="txt">${esc(c.front)}</div></div>
                            <div class="nz-flip-face nz-flip-back"><div class="lbl">Antwort</div><div class="txt">${esc(c.back)}</div></div>
                        </div>
                    </div>
                    <div class="nz-tap-hint">${st.flipped ? "Wie lief's?" : "Tippe auf die Karte zum Umdrehen"}</div>
                    <div class="nz-study-actions" style="${st.flipped ? "" : "visibility:hidden;"}">
                        <button class="nz-btn again" id="nz-again">&#x21BA; Nochmal</button>
                        <button class="nz-btn good" id="nz-good">&#x2713; Gewusst</button>
                    </div>
                    <div style="margin-top:1rem;"><button class="nz-btn" id="nz-exit2" style="font-size:0.78rem;padding:0.4rem 0.9rem;">Beenden</button></div>
                </div>`;
            document.getElementById("nz-flip").onclick = () => { st.flipped = !st.flipped; renderTab(); };
            const good = document.getElementById("nz-good"), again = document.getElementById("nz-again");
            if (good) good.onclick = () => { c.known = true; st.good++; touch(n); next(); };
            if (again) again.onclick = () => { next(); };
            document.getElementById("nz-exit2").onclick = () => { ui.study = null; renderTab(); renderSidebar(); };
            function next() { st.idx++; st.flipped = false; renderTab(); }
        }

        /* ---------- MINDMAP tab ---------- */
        let mm = { connectSrc: null, selected: null, connecting: false };
        function renderMind(body, n) {
            n.mind = n.mind || { nodes: [], edges: [] };
            if (!n.mind.nodes.some(nd => nd.root)) {
                n.mind.nodes.unshift({ id: "root", text: n.title || "Thema", x: 0.5, y: 0.5, root: true });
            }
            // keep root label in sync with title if unchanged manually
            body.innerHTML = `
                <div class="nz-mm-toolbar">
                    <button class="nz-btn accent" id="mm-add">&#43; Knoten</button>
                    <button class="nz-btn" id="mm-connect">&#x1F517; Verbinden</button>
                    <button class="nz-btn" id="mm-rename">&#x270E; Umbenennen</button>
                    <button class="nz-btn" id="mm-del">&#x1F5D1; Knoten l&ouml;schen</button>
                </div>
                <div class="nz-mm-canvas" id="mm-canvas"><svg id="mm-svg"></svg></div>
                <div class="nz-mm-hint">Ziehen zum Verschieben &middot; Klick w&auml;hlt aus &middot; Neuer Knoten wird mit dem gew&auml;hlten verbunden &middot; Doppelklick benennt um.</div>
            `;
            mm.selected = mm.selected && n.mind.nodes.some(x => x.id === mm.selected) ? mm.selected : "root";
            mm.connecting = false; mm.connectSrc = null;
            drawMind(n);

            document.getElementById("mm-add").onclick = () => {
                const src = n.mind.nodes.find(x => x.id === mm.selected) || n.mind.nodes[0];
                const ang = Math.random() * Math.PI * 2;
                const nx = Math.min(0.92, Math.max(0.08, src.x + Math.cos(ang) * 0.2));
                const ny = Math.min(0.92, Math.max(0.08, src.y + Math.sin(ang) * 0.22));
                const id = uid();
                n.mind.nodes.push({ id, text: "Idee", x: nx, y: ny, root: false });
                if (src) n.mind.edges.push({ a: src.id, b: id });
                mm.selected = id; touch(n); drawMind(n);
                setTimeout(() => renameNode(n, id), 30);
            };
            document.getElementById("mm-connect").onclick = () => {
                mm.connecting = !mm.connecting; mm.connectSrc = mm.connecting ? mm.selected : null;
                document.getElementById("mm-canvas").classList.toggle("connecting", mm.connecting);
                drawMind(n);
            };
            document.getElementById("mm-rename").onclick = () => renameNode(n, mm.selected);
            document.getElementById("mm-del").onclick = () => {
                if (!mm.selected || mm.selected === "root") { alert("Der Hauptknoten kann nicht gelöscht werden."); return; }
                n.mind.nodes = n.mind.nodes.filter(x => x.id !== mm.selected);
                n.mind.edges = n.mind.edges.filter(e => e.a !== mm.selected && e.b !== mm.selected);
                mm.selected = "root"; touch(n); drawMind(n);
            };
        }

        function renameNode(n, id) {
            const node = n.mind.nodes.find(x => x.id === id); if (!node) return;
            const v = prompt("Text für den Knoten:", node.text);
            if (v !== null) { node.text = v.trim() || node.text; if (node.root) n.title = node.text; touch(n); drawMind(n); renderSidebar(); }
        }

        function drawMind(n) {
            const canvas = document.getElementById("mm-canvas");
            const svg = document.getElementById("mm-svg");
            if (!canvas) return;
            const rect = canvas.getBoundingClientRect();
            const W = rect.width, H = rect.height;
            // edges
            let lines = "";
            n.mind.edges.forEach(e => {
                const a = n.mind.nodes.find(x => x.id === e.a), b = n.mind.nodes.find(x => x.id === e.b);
                if (a && b) lines += `<line x1="${a.x * W}" y1="${a.y * H}" x2="${b.x * W}" y2="${b.y * H}" stroke="rgba(192,132,252,0.4)" stroke-width="2" />`;
            });
            svg.innerHTML = lines;
            // nodes
            canvas.querySelectorAll(".nz-mm-node").forEach(x => x.remove());
            n.mind.nodes.forEach(node => {
                const d = document.createElement("div");
                d.className = "nz-mm-node" + (node.root ? " root" : "") + (node.id === mm.selected ? " sel" : "") + (node.id === mm.connectSrc ? " connect-src" : "");
                d.style.left = (node.x * 100) + "%"; d.style.top = (node.y * 100) + "%";
                d.textContent = node.text;
                d.dataset.id = node.id;
                attachNodeEvents(d, node, n, canvas);
                canvas.appendChild(d);
            });
        }

        function attachNodeEvents(d, node, n, canvas) {
            let dragging = false, moved = false, start = null;
            d.addEventListener("pointerdown", (ev) => {
                ev.preventDefault();
                if (mm.connecting) return;
                dragging = true; moved = false; start = { x: ev.clientX, y: ev.clientY };
                d.setPointerCapture(ev.pointerId);
            });
            d.addEventListener("pointermove", (ev) => {
                if (!dragging) return;
                if (Math.abs(ev.clientX - start.x) + Math.abs(ev.clientY - start.y) > 3) moved = true;
                const rect = canvas.getBoundingClientRect();
                node.x = Math.min(0.97, Math.max(0.03, (ev.clientX - rect.left) / rect.width));
                node.y = Math.min(0.95, Math.max(0.05, (ev.clientY - rect.top) / rect.height));
                d.style.left = (node.x * 100) + "%"; d.style.top = (node.y * 100) + "%";
                // redraw edges live
                const svg = document.getElementById("mm-svg"); const W = rect.width, H = rect.height;
                let lines = "";
                n.mind.edges.forEach(e => {
                    const a = n.mind.nodes.find(x => x.id === e.a), b = n.mind.nodes.find(x => x.id === e.b);
                    if (a && b) lines += `<line x1="${a.x * W}" y1="${a.y * H}" x2="${b.x * W}" y2="${b.y * H}" stroke="rgba(192,132,252,0.4)" stroke-width="2" />`;
                });
                svg.innerHTML = lines;
            });
            d.addEventListener("pointerup", (ev) => {
                if (dragging && moved) { dragging = false; touch(n); return; }
                dragging = false;
                // click (no move)
                if (mm.connecting) {
                    if (!mm.connectSrc) { mm.connectSrc = node.id; mm.selected = node.id; drawMind(n); }
                    else if (mm.connectSrc !== node.id) {
                        const exists = n.mind.edges.some(e => (e.a === mm.connectSrc && e.b === node.id) || (e.b === mm.connectSrc && e.a === node.id));
                        if (!exists) n.mind.edges.push({ a: mm.connectSrc, b: node.id });
                        mm.connecting = false; mm.connectSrc = null;
                        canvas.classList.remove("connecting"); touch(n); drawMind(n);
                    }
                } else {
                    mm.selected = node.id; drawMind(n);
                }
            });
            d.addEventListener("dblclick", () => renameNode(n, node.id));
        }

        /* ---------- actions ---------- */
        function createNote() {
            const id = uid();
            state.notes.unshift({ id, title: "Neue Notiz", subject: ui.filter || "", body: "", updatedAt: Date.now(), cards: [], mind: { nodes: [], edges: [] } });
            state.activeId = id; ui.tab = "text"; ui.study = null; save();
            renderSidebar(); renderDetail();
            setTimeout(() => { const t = document.getElementById("nz-title"); if (t) { t.focus(); t.select(); } }, 30);
        }

        /* ---------- global events (delegation) ---------- */
        function bind() {
            document.getElementById("nz-new").onclick = createNote;
            document.getElementById("nz-search").addEventListener("input", (e) => { ui.search = e.target.value; renderSidebar(); });
            document.getElementById("nz-filter").addEventListener("click", (e) => {
                const chip = e.target.closest(".nz-chip"); if (!chip) return;
                ui.filter = chip.dataset.f; renderSidebar();
            });
            document.getElementById("nz-list").addEventListener("click", (e) => {
                const item = e.target.closest(".nz-item"); if (!item) return;
                state.activeId = item.dataset.id; ui.tab = "text"; ui.study = null; save();
                renderSidebar(); renderDetail();
            });
            // detail delegation
            document.getElementById("nz-detail").addEventListener("click", (e) => {
                const tab = e.target.closest(".nz-tab");
                if (tab) { ui.tab = tab.dataset.tab; ui.study = null; renderTab(); document.querySelectorAll(".nz-tab").forEach(t => t.classList.toggle("active", t.dataset.tab === ui.tab)); return; }
                if (e.target.closest("#nz-del")) {
                    const n = activeNote(); if (!n) return;
                    if (confirm("Diese Notiz wirklich löschen?")) {
                        state.notes = state.notes.filter(x => x.id !== n.id);
                        state.activeId = state.notes.length ? state.notes.sort((a, b) => b.updatedAt - a.updatedAt)[0].id : null;
                        save(); renderSidebar(); renderDetail();
                    }
                }
            });
            document.getElementById("nz-detail").addEventListener("input", (e) => {
                const n = activeNote(); if (!n) return;
                if (e.target.id === "nz-title") { n.title = e.target.value; touch(n); flashSaved(); clearTimeout(bind._t1); bind._t1 = setTimeout(renderSidebar, 400); }
                if (e.target.id === "nz-subject") { n.subject = e.target.value; touch(n); flashSaved(); clearTimeout(bind._t2); bind._t2 = setTimeout(renderSidebar, 400); }
            });
        }

        /* ---------- init ---------- */
        load();
        bind();
        renderSidebar();
        renderDetail();
        window.addEventListener("resize", () => { if (ui.tab === "mind") { const n = activeNote(); if (n) drawMind(n); } });
    })();
    </script>
</body>
</html>
