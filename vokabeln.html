<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeln | NeoStudy</title>
    <link rel="stylesheet" href="css/style.css?v=10">
    <link rel="stylesheet" href="css/englisch.css?v=10">
    <style>
        html { background: #0a0a14; }

        /* ===== LEVEL SELECTOR ===== */
        .level-tabs {
            display: flex;
            gap: 0.8rem;
            margin: 1rem 0 1.5rem;
            flex-wrap: wrap;
        }
        .level-btn {
            flex: 1;
            min-width: 120px;
            padding: 1.1rem 1.2rem;
            border-radius: 14px;
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(6px);
            border: 2px solid transparent;
            color: var(--color-text);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .level-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        .level-btn:hover { transform: translateY(-2px); }

        /* B1 blue */
        .level-btn[data-level="b1"] { border-color: rgba(68, 147, 248, 0.3); }
        .level-btn[data-level="b1"]::before { background: linear-gradient(135deg, rgba(68, 147, 248, 0.12), transparent); }
        .level-btn[data-level="b1"]:hover { border-color: rgba(68, 147, 248, 0.6); }
        .level-btn[data-level="b1"].active {
            border-color: #4493f8;
            background: linear-gradient(135deg, rgba(68, 147, 248, 0.25), rgba(68, 147, 248, 0.08));
            box-shadow: 0 4px 24px rgba(68, 147, 248, 0.3), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .level-btn[data-level="b1"].active::before { opacity: 1; }

        /* B2 purple */
        .level-btn[data-level="b2"] { border-color: rgba(163, 113, 247, 0.3); }
        .level-btn[data-level="b2"]::before { background: linear-gradient(135deg, rgba(163, 113, 247, 0.12), transparent); }
        .level-btn[data-level="b2"]:hover { border-color: rgba(163, 113, 247, 0.6); }
        .level-btn[data-level="b2"].active {
            border-color: #a371f7;
            background: linear-gradient(135deg, rgba(163, 113, 247, 0.25), rgba(163, 113, 247, 0.08));
            box-shadow: 0 4px 24px rgba(163, 113, 247, 0.3), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .level-btn[data-level="b2"].active::before { opacity: 1; }

        /* C1 gold */
        .level-btn[data-level="c1"] { border-color: rgba(210, 153, 34, 0.3); }
        .level-btn[data-level="c1"]::before { background: linear-gradient(135deg, rgba(210, 153, 34, 0.12), transparent); }
        .level-btn[data-level="c1"]:hover { border-color: rgba(210, 153, 34, 0.6); }
        .level-btn[data-level="c1"].active {
            border-color: #d29922;
            background: linear-gradient(135deg, rgba(210, 153, 34, 0.25), rgba(210, 153, 34, 0.08));
            box-shadow: 0 4px 24px rgba(210, 153, 34, 0.3), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .level-btn[data-level="c1"].active::before { opacity: 1; }

        /* Syn green */
        .level-btn[data-level="syn"] { border-color: rgba(63, 185, 80, 0.3); }
        .level-btn[data-level="syn"]::before { background: linear-gradient(135deg, rgba(63, 185, 80, 0.12), transparent); }
        .level-btn[data-level="syn"]:hover { border-color: rgba(63, 185, 80, 0.6); }
        .level-btn[data-level="syn"].active {
            border-color: #3fb950;
            background: linear-gradient(135deg, rgba(63, 185, 80, 0.25), rgba(63, 185, 80, 0.08));
            box-shadow: 0 4px 24px rgba(63, 185, 80, 0.3), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .level-btn[data-level="syn"].active::before { opacity: 1; }
        .level-btn[data-level="syn"] .level-badge { background: rgba(63, 185, 80, 0.2); color: #56d364; }

        .level-btn[data-level="koll"] { border-color: rgba(240, 136, 62, 0.3); }
        .level-btn[data-level="koll"]::before { background: linear-gradient(135deg, rgba(240, 136, 62, 0.12), transparent); }
        .level-btn[data-level="koll"]:hover { border-color: rgba(240, 136, 62, 0.6); }
        .level-btn[data-level="koll"].active {
            border-color: #f0883e;
            background: linear-gradient(135deg, rgba(240, 136, 62, 0.25), rgba(240, 136, 62, 0.08));
            box-shadow: 0 4px 24px rgba(240, 136, 62, 0.3), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .level-btn[data-level="koll"].active::before { opacity: 1; }
        .level-btn[data-level="koll"] .level-badge { background: rgba(240, 136, 62, 0.2); color: #ffa657; }

        .level-btn .level-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .level-btn[data-level="b1"] .level-badge { background: rgba(68, 147, 248, 0.2); color: #79b8ff; }
        .level-btn[data-level="b2"] .level-badge { background: rgba(163, 113, 247, 0.2); color: #c8a5ff; }
        .level-btn[data-level="c1"] .level-badge { background: rgba(210, 153, 34, 0.2); color: #e3b341; }
        .level-btn.active .level-badge { background: rgba(255,255,255,0.15); color: #fff; }

        .level-btn small {
            display: block;
            font-weight: 400;
            font-size: 0.78rem;
            opacity: 0.65;
            margin-top: 0.35rem;
        }

        /* ===== TOPIC PILLS ===== */
        .topic-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0 0 1.5rem;
        }
        .topic-pill {
            padding: 0.55rem 1.2rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--color-text-secondary);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .topic-pill:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--color-text);
        }
        .topic-pill.active {
            background: rgba(68, 147, 248, 0.12);
            border-color: rgba(68, 147, 248, 0.4);
            color: #fff;
        }
        /* Purple active for B2 */
        body.level-b2 .topic-pill.active {
            background: rgba(163, 113, 247, 0.12);
            border-color: rgba(163, 113, 247, 0.4);
        }
        /* Gold active for C1 */
        body.level-c1 .topic-pill.active {
            background: rgba(210, 153, 34, 0.12);
            border-color: rgba(210, 153, 34, 0.4);
        }

        /* ===== WORD COUNT ===== */
        .vocab-count-bar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--color-text-muted);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .vocab-count-bar .count-num {
            font-weight: 700;
            font-size: 1rem;
        }

        /* ===== VOCAB CARD GRID ===== */
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 0.7rem;
        }

        /* ===== VOCAB CARD ===== */
        .vocab-card {
            position: relative;
            min-height: 130px;
            border-radius: 14px;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.25s ease;
            overflow: hidden;
            perspective: 600px;
        }
        .vocab-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        /* Colored left border by level */
        .vocab-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 14px 0 0 14px;
        }
        body.level-b1 .vocab-card::before { background: #4493f8; }
        body.level-b2 .vocab-card::before { background: #a371f7; }
        body.level-c1 .vocab-card::before { background: #d29922; }
        body.level-syn .vocab-card::before { background: #3fb950; }
        body.level-koll .vocab-card::before { background: #f0883e; }

        /* Flip icon */
        .vocab-card .flip-icon {
            position: absolute;
            top: 0.6rem;
            right: 0.7rem;
            font-size: 0.8rem;
            opacity: 0.3;
            transition: opacity 0.2s;
        }
        .vocab-card:hover .flip-icon { opacity: 0.6; }
        .vocab-card.flipped .flip-icon { opacity: 0; }

        /* FRONT */
        .vocab-card .card-front {
            padding: 1.2rem 1.2rem 1rem 1.4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 130px;
        }
        .vocab-card .card-front .word-main {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }
        .vocab-card .card-front .word-plural {
            font-size: 0.76rem;
            color: rgba(255,255,255,0.38);
            margin-top: 0.25rem;
            letter-spacing: 0.2px;
        }

        /* BACK */
        .vocab-card .card-back {
            display: none;
            padding: 1.1rem 1.1rem 0.9rem 1.3rem;
            min-height: 160px;
        }
        .vocab-card.flipped .card-front { display: none; }
        .vocab-card.flipped .card-back { display: flex; flex-direction: column; justify-content: center; }

        .vocab-card .card-back .translation {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.3;
        }
        body.level-b1 .vocab-card .card-back .translation { color: #79b8ff; }
        body.level-b2 .vocab-card .card-back .translation { color: #c8a5ff; }
        body.level-c1 .vocab-card .card-back .translation { color: #e3b341; }
        body.level-syn .vocab-card .card-back .translation { color: #56d364; }
        body.level-koll .vocab-card .card-back .translation { color: #ffa657; }

        .vocab-card .card-back .explanation {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.5;
            margin-top: 0.4rem;
        }
        .vocab-card .card-back .example {
            font-size: 0.78rem;
            font-style: italic;
            color: var(--color-text-muted);
            margin-top: 0.5rem;
            line-height: 1.45;
        }
        .vocab-card .card-back .synonyme {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.38);
            margin-top: 0.35rem;
            font-style: italic;
        }
        .vocab-card .card-back .synonyme::before {
            content: '\2248\00A0';
            font-style: normal;
            opacity: 0.6;
        }
        .vocab-card .card-back .back-level {
            display: inline-block;
            margin-top: 0.6rem;
            padding: 0.1rem 0.5rem;
            border-radius: 10px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            width: fit-content;
        }
        body.level-b1 .back-level { background: rgba(68, 147, 248, 0.15); color: #79b8ff; }
        body.level-b2 .back-level { background: rgba(163, 113, 247, 0.15); color: #c8a5ff; }
        body.level-c1 .back-level { background: rgba(210, 153, 34, 0.15); color: #e3b341; }
        body.level-syn .back-level { background: rgba(63, 185, 80, 0.15); color: #56d364; }
        body.level-koll .back-level { background: rgba(240, 136, 62, 0.15); color: #ffa657; }

        /* Subtle top border glow on hover */
        .vocab-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 4px;
            right: 0;
            height: 1px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        body.level-b1 .vocab-card::after { background: linear-gradient(90deg, rgba(68,147,248,0.5), transparent); }
        body.level-b2 .vocab-card::after { background: linear-gradient(90deg, rgba(163,113,247,0.5), transparent); }
        body.level-c1 .vocab-card::after { background: linear-gradient(90deg, rgba(210,153,34,0.5), transparent); }
        .vocab-card:hover::after { opacity: 1; }

        /* ===== SECTION LABEL ===== */
        .section-label {
            color: var(--color-text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.6rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .level-btn { padding: 0.8rem 0.6rem; font-size: 0.95rem; }
            .vocab-grid { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
            .vocab-card .card-front { padding: 1rem 0.8rem 0.8rem 1rem; min-height: 100px; }
            .vocab-card .card-back { padding: 1rem 0.8rem 0.8rem 1rem; min-height: 100px; }
            .vocab-card .card-front .word-main { font-size: 1rem; }
        }
        @media (max-width: 380px) {
            .vocab-grid { grid-template-columns: 1fr; }
        }

        /* ===== MODE SWITCHER ===== */
        .mode-tabs {
            display: flex;
            gap: 0.4rem;
            margin: 1rem 0 1.2rem;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 0.5rem 0.9rem;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--color-text-muted);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .mode-btn.active {
            background: rgba(68,147,248,0.15);
            border-color: rgba(68,147,248,0.4);
            color: #fff;
        }
        body.level-b2 .mode-btn.active { background: rgba(163,113,247,0.15); border-color: rgba(163,113,247,0.4); }
        body.level-c1 .mode-btn.active { background: rgba(210,153,34,0.15); border-color: rgba(210,153,34,0.4); }
        body.level-syn .mode-btn.active { background: rgba(63,185,80,0.15); border-color: rgba(63,185,80,0.4); }
        body.level-koll .mode-btn.active { background: rgba(240,136,62,0.15); border-color: rgba(240,136,62,0.4); }

        /* ===== PROGRESS BAR ===== */
        .progress-strip {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
            font-size: 0.82rem;
            color: var(--color-text-muted);
        }
        .progress-track {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        body.level-b1 .progress-fill { background: #4493f8; }
        body.level-b2 .progress-fill { background: #a371f7; }
        body.level-c1 .progress-fill { background: #d29922; }
        body.level-syn .progress-fill { background: #3fb950; }
        body.level-koll .progress-fill { background: #f0883e; }
        /* ===== SYN LEVEL FILTER ===== */
        .syn-level-filter {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.7rem;
        }
        .syn-lvl-btn {
            padding: 0.35rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(63,185,80,0.25);
            background: rgba(63,185,80,0.05);
            color: rgba(255,255,255,0.45);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .syn-lvl-btn:hover { background: rgba(63,185,80,0.12); color: #fff; }
        .syn-lvl-btn.active {
            background: rgba(63,185,80,0.2);
            border-color: rgba(63,185,80,0.55);
            color: #56d364;
        }

        /* ===== KNOW/DONT KNOW BUTTONS ===== */
        .card-actions {
            display: none;
            gap: 0.5rem;
            margin-top: 0.6rem;
        }
        .vocab-card.flipped .card-actions { display: flex; }
        .card-action-btn {
            flex: 1;
            padding: 0.45rem;
            border-radius: 8px;
            border: none;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .card-action-btn.know {
            background: rgba(63,185,80,0.15);
            color: #3fb950;
            border: 1px solid rgba(63,185,80,0.3);
        }
        .card-action-btn.know:hover { background: rgba(63,185,80,0.25); }
        .card-action-btn.again {
            background: rgba(248,81,73,0.12);
            color: #f85149;
            border: 1px solid rgba(248,81,73,0.3);
        }
        .card-action-btn.again:hover { background: rgba(248,81,73,0.22); }

        /* ===== QUIZ MODE ===== */
        .quiz-area { max-width: 600px; }
        .quiz-card {
            background: rgba(13,17,23,0.8);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .quiz-word {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.3rem;
        }
        .quiz-hint {
            font-size: 0.82rem;
            color: var(--color-text-muted);
            margin-bottom: 1.2rem;
        }
        .quiz-opts { display: flex; flex-direction: column; gap: 0.5rem; }
        .quiz-opt {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--color-text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }
        .quiz-opt:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .quiz-opt.correct { background: rgba(63,185,80,0.2); border-color: #3fb950; color: #3fb950; }
        .quiz-opt.wrong { background: rgba(248,81,73,0.15); border-color: #f85149; color: #f85149; }
        .quiz-opt.disabled { pointer-events: none; opacity: 0.6; }
        .quiz-progress { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 0.5rem; }
        .quiz-result {
            text-align: center;
            padding: 2rem;
        }
        .quiz-result .score-big {
            font-size: 3rem;
            font-weight: 800;
            margin: 0.5rem 0;
        }
        .quiz-result .score-label { color: var(--color-text-muted); font-size: 0.95rem; }
        .quiz-result .retry-btn {
            margin-top: 1.5rem;
            padding: 0.7rem 2rem;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        body.level-b1 .score-big { color: #4493f8; }
        body.level-b2 .score-big { color: #a371f7; }
        body.level-c1 .score-big { color: #d29922; }
        body.level-b1 .retry-btn { background: rgba(68,147,248,0.2); color: #79b8ff; }
        body.level-b2 .retry-btn { background: rgba(163,113,247,0.2); color: #c8a5ff; }
        body.level-c1 .retry-btn { background: rgba(210,153,34,0.2); color: #e3b341; }

        /* ===== MATCH MODE ===== */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }
        .match-col { display: flex; flex-direction: column; gap: 0.5rem; }
        .match-item {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            background: rgba(13,17,23,0.8);
            border: 2px solid rgba(255,255,255,0.08);
            color: var(--color-text);
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .match-item:hover { border-color: rgba(255,255,255,0.25); }
        .match-item.selected { border-color: #4493f8; background: rgba(68,147,248,0.1); }
        body.level-b2 .match-item.selected { border-color: #a371f7; background: rgba(163,113,247,0.1); }
        body.level-c1 .match-item.selected { border-color: #d29922; background: rgba(210,153,34,0.1); }
        .match-item.correct {
            background: rgba(63,185,80,0.15);
            border-color: rgba(63,185,80,0.4);
            color: #3fb950;
            pointer-events: none;
            opacity: 0.6;
        }
        .match-item.wrong { animation: matchShake 0.4s; border-color: #f85149; }
        @keyframes matchShake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .match-score { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--color-text-muted); }

        /* ===== TYPE MODE ===== */
        .type-area { max-width: 600px; }
        .type-card {
            background: rgba(13,17,23,0.8);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .type-word {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.3rem;
        }
        .type-explain {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.55);
            margin-bottom: 1rem;
        }
        .type-row { display: flex; gap: 0.5rem; }
        .type-input {
            flex: 1;
            padding: 0.7rem 1rem;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .type-input:focus { border-color: rgba(68,147,248,0.5); }
        .type-check {
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;

        body.level-b2 .type-check { background: rgba(163,113,247,0.2); color: #c8a5ff; }

        /* ===== SPEED MODE ===== */
        .speed-timer-bar {

            margin-bottom: 1rem;

        .speed-time {
            font-size: 2.5rem;
            font-weight: 800;

        body.level-b1 .speed-time { color: #4493f8; }
        body.level-b2 .speed-time { color: #a371f7; }
        body.level-c1 .speed-time { color: #d29922; }
        .speed-time.danger { color: #f85149 !important; animation: speedPulse 0.5s infinite; }
        @keyframes speedPulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
        .speed-score-live {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            margin-top: 0.2rem;
        }
        .speed-start-btn {
            display: block;
            margin: 2rem auto;
            padding: 1rem 3rem;
            border-radius: 14px;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;

        body.level-b1 .speed-start-btn { background: rgba(68,147,248,0.2); color: #79b8ff; }
        body.level-b2 .speed-start-btn { background: rgba(163,113,247,0.2); color: #c8a5ff; }
        body.level-c1 .speed-start-btn { background: rgba(210,153,34,0.2); color: #e3b341; }

        /* ===== SURVIVAL MODE ===== */
        .lives { font-size: 1.3rem; letter-spacing: 2px; margin-bottom: 0.3rem; }
        .lives-label { font-size: 0.8rem; color: var(--color-text-muted); }

        body.level-b1 .survival-streak { color: #4493f8; }
        body.level-b2 .survival-streak { color: #a371f7; }
        body.level-c1 .survival-streak { color: #d29922; }

        /* ===== SYNONYME MODE ===== */
        .syn-panel {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            max-width: 780px;
        }
        .syn-group {
            background: rgba(13,17,23,0.85);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.07);
            padding: 1.4rem 1.6rem 1.2rem;
            position: relative;
            overflow: hidden;
        }
        .syn-group::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            border-radius: 16px 0 0 16px;
            background: linear-gradient(180deg, #a371f7, #4493f8);
        }
        .syn-main-row {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        .syn-main-word {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
        }
        .syn-translation {
            font-size: 0.88rem;
            color: rgba(255,255,255,0.45);
        }
        .syn-note {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.38);
            font-style: italic;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        .syn-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 0.55rem;
        }
        .syn-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .syn-chip {
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .syn-chip-inner {
            display: flex;
            flex-direction: column;
            padding: 0.55rem 0.9rem;
            border-radius: 10px;
            background: rgba(163,113,247,0.08);
            border: 1px solid rgba(163,113,247,0.25);
            transition: all 0.18s;
        }
        .syn-chip:hover .syn-chip-inner {
            background: rgba(163,113,247,0.18);
            border-color: rgba(163,113,247,0.5);
            transform: translateY(-2px);
        }
        .syn-chip-word {
            font-size: 0.96rem;
            font-weight: 600;
            color: #c8a5ff;
        }
        .syn-chip-note {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.45);
            margin-top: 0.15rem;
            line-height: 1.3;
        }
        .syn-diff-row {
            margin-top: 1rem;
            padding-top: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .syn-diff-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .syn-diff-table th {
            text-align: left;
            padding: 0.3rem 0.6rem;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .syn-diff-table td {
            padding: 0.35rem 0.6rem;
            color: rgba(255,255,255,0.7);
            border-top: 1px solid rgba(255,255,255,0.04);
            vertical-align: top;
        }
        .syn-diff-table td:first-child {
            font-weight: 700;
            color: #c8a5ff;
            white-space: nowrap;
        }
        .syn-diff-table tr:hover td { background: rgba(255,255,255,0.03); }
        .syn-example {
            font-style: italic;
            color: rgba(255,255,255,0.4);
            font-size: 0.78rem;
        }

        /* ===== SENTENCE BUILD ===== */
        .sentence-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
            margin: 1rem 0;
        }
        .sentence-chip {
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--color-text);
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .sentence-chip:hover { background: rgba(255,255,255,0.12); }
        .sentence-chip.used { opacity: 0.3; pointer-events: none; }
        .sentence-result {
            min-height: 50px;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 2px dashed rgba(255,255,255,0.12);
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .sentence-placed {
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        body.level-b1 .sentence-placed { background: rgba(68,147,248,0.15); color: #79b8ff; }
        body.level-b2 .sentence-placed { background: rgba(163,113,247,0.15); color: #c8a5ff; }
        body.level-c1 .sentence-placed { background: rgba(210,153,34,0.15); color: #e3b341; }

        /* ===== BLANK/DESCRIBE shared ===== */
        .blank-sentence {
            font-size: 1.05rem;
            color: var(--color-text);
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        .blank-gap {
            display: inline-block;
            min-width: 80px;
            border-bottom: 2px dashed rgba(255,255,255,0.3);
            margin: 0 0.2rem;
            text-align: center;
        }

        /* ===== LEITNER MODE ===== */
        .leitner-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            margin-bottom: 1rem;
            max-width: 600px;
        }
        .leitner-stat {
            padding: 0.85rem 0.6rem;
            border-radius: 12px;
            background: rgba(13,17,23,0.8);
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
        }
        .leitner-stat-num {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1;
        }
        .leitner-stat-label {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            margin-top: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .leitner-stat.learned .leitner-stat-num { color: #3fb950; }
        body.level-b1 .leitner-stat.total .leitner-stat-num { color: #79b8ff; }
        body.level-b2 .leitner-stat.total .leitner-stat-num { color: #c8a5ff; }
        body.level-c1 .leitner-stat.total .leitner-stat-num { color: #e3b341; }

        .leitner-box-row {
            display: flex;
            gap: 0.3rem;
            margin: 0 0 1.2rem;
            flex-wrap: wrap;
            max-width: 600px;
            font-size: 0.75rem;
        }
        .leitner-box-pill {
            padding: 0.35rem 0.7rem;
            border-radius: 20px;
            background: rgba(255,255,255,0.04);
            color: var(--color-text-muted);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .leitner-box-pill strong { color: #fff; margin-left: 0.2rem; }
        .leitner-box-pill.has { background: rgba(68,147,248,0.12); border-color: rgba(68,147,248,0.3); color: #fff; }
        body.level-b2 .leitner-box-pill.has { background: rgba(163,113,247,0.12); border-color: rgba(163,113,247,0.3); }
        body.level-c1 .leitner-box-pill.has { background: rgba(210,153,34,0.12); border-color: rgba(210,153,34,0.3); }

        .leitner-topic-badge {
            display: inline-block;
            margin-bottom: 0.5rem;
            padding: 0.2rem 0.6rem;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            font-size: 0.72rem;
            color: var(--color-text-muted);
        }
        .leitner-box-indicator {
            display: inline-flex;
            gap: 0.2rem;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
        .leitner-box-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
        }
        .leitner-box-dot.filled { background: #3fb950; }

        /* ===== STORY/TEXT MODE ===== */
        .story-card {
            background: rgba(13,17,23,0.85);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            line-height: 1.8;

        .story-title {
            font-size: 0.78rem;
            text-transform: uppercase;

        .story-sentence {

        .story-word {

            border-radius: 3px;

            border-color: #3fb950;
            color: #3fb950;
        }
        .story-pop {
            position: absolute;
            background: #0d1117;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            font-size: 0.85rem;
            color: #fff;
            max-width: 280px;
            z-index: 200;
            box-shadow: 0 6px 24px rgba(0,0,0,0.7);
            pointer-events: none;

        .story-pop strong { display: block; margin-bottom: 0.25rem; color: #79b8ff; }
        body.level-b2 .story-pop strong { color: #c8a5ff; }
        body.level-c1 .story-pop strong { color: #e3b341; }
        .story-pop span { color: var(--color-text-muted); font-size: 0.78rem; line-height: 1.4; }

        /* ===== BILDER MODE ===== */
        .bilder-emoji-box {
            text-align: center;
            padding: 2rem 1rem 1.5rem;
            background: rgba(13,17,23,0.85);

            margin-bottom: 1rem;

        .bilder-emoji {
            font-size: 3.5rem;
            letter-spacing: 0.3rem;
            line-height: 1.1;
            user-select: none;
        }
        .bilder-hint {
            font-size: 0.82rem;
            color: var(--color-text-muted);
            margin-top: 0.8rem;
        }

        // ===== LEITNER (SRS) =====
        const LEITNER_INTERVALS_MS = [
            0,
            4 * 3600 * 1000,
            24 * 3600 * 1000,
            3 * 24 * 3600 * 1000,
            7 * 24 * 3600 * 1000,
            21 * 24 * 3600 * 1000
        ];
        function getLeitnerData() {
            try { return JSON.parse(localStorage.getItem('neo_vocab_leitner') || '{}'); } catch(e) { return {}; }
        }
        function saveLeitnerData(d) { localStorage.setItem('neo_vocab_leitner', JSON.stringify(d)); }
        function leitnerKey(level, topic, item) {
            return level + '|' + topic + '|' + stripHtmlSafe(item[0]);
        }
        function stripHtmlSafe(s) { var d = document.createElement('div'); d.innerHTML = s; return d.textContent || ''; }
        function recordLeitner(level, topic, item, correct) {
            if (!item) return;
            var d = getLeitnerData();
            var k = leitnerKey(level, topic, item);
            var e = d[k] || { box: 1, due: 0 };
            if (correct) e.box = Math.min(5, (e.box || 1) + 1);
            else e.box = 1;
            e.due = Date.now() + LEITNER_INTERVALS_MS[e.box];
            e.seen = Date.now();
            d[k] = e;
            saveLeitnerData(d);
        }
        function getAllDueForLevel(level) {
            var d = getLeitnerData();
            var now = Date.now();
            var due = [];
            for (var k in d) {
                if (k.indexOf(level + '|') !== 0) continue;
                if ((d[k].due || 0) > now) continue;
                var parts = k.split('|');
                if (parts.length < 3) continue;
                var topic = parts[1];
                var word = parts.slice(2).join('|');
                var items = VOCAB[level + ':' + topic] || [];
                var found = null;
                for (var i = 0; i < items.length; i++) {
                    if (stripHtmlSafe(items[i][0]) === word) { found = items[i]; break; }
                }
                if (found) due.push({ topic: topic, item: found, box: d[k].box || 1 });
            }
            return due;
        }
        function getLeitnerStats(level) {
            var d = getLeitnerData();
            var now = Date.now();
            var stats = { total: 0, due: 0, learned: 0, byBox: [0,0,0,0,0,0] };
            for (var k in d) {
                if (k.indexOf(level + '|') !== 0) continue;
                stats.total++;
                var b = d[k].box || 1;
                stats.byBox[b]++;
                if ((d[k].due || 0) <= now) stats.due++;
                if (b >= 4) stats.learned++;
            }
            return stats;

        function getEmojiFor(item) {

            var found = [];
            for (var i = 0; i < EMOJI_MAP.length; i++) {
                if (EMOJI_MAP[i][0].test(hay)) {
                    if (found.indexOf(EMOJI_MAP[i][1]) === -1) {
                        found.push(EMOJI_MAP[i][1]);
                        if (found.length >= 3) break;

            return found.slice(0, 3).join(' ');

        function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

        function getRandomOptions(correct, allData, count) {
            var opts = [correct];
            var pool = allData.filter(function(item) { return item[1] !== correct; });
            pool = shuffle(pool);
            for (var i = 0; i < count - 1 && i < pool.length; i++) opts.push(pool[i][1]);
            while (opts.length < count) opts.push('---');
            return shuffle(opts);
        }

        // ===== MODE: AUDIO (Vorlesen / hands-free) =====
        var audioState = {

        function decodeEntities(s) {
            var el = document.createElement('textarea');

        function cleanGerman(s) {
            return decodeEntities(s).replace(/\|/g, '').replace(/­/g, '').trim();
        }
        function transText(s) {
            // item[1] is "переклад / english" -> read only the first (Slavic) part
            return decodeEntities(String(s || '').split(' / ')[0]).trim();

        function shuffleArr(a) {
            for (var i = a.length - 1; i > 0; i--) {

        }

                    title: cleanGerman(item[0]),

                });

                navigator.mediaSession.setActionHandler('pause', function () { if (audioState.playing) pauseAudio(); });

            updateAudioUI();

            var steps = [{ t: cleanGerman(item[0]), v: de }];

            if (s.readMode !== 'word') steps.push({ t: transText(item[1]), v: sl });

        // ===== MODE: CARDS =====
        function renderCards(grid, data, lvl, key) {
            var p = getProgress();
            // Sort: unknown first
            var indexed = data.map(function(item, i) { return { item: item, idx: i }; });
            indexed.sort(function(a, b) {
                var aK = p[key + ':' + a.idx] && p[key + ':' + a.idx].known ? 1 : 0;
                var bK = p[key + ':' + b.idx] && p[key + ':' + b.idx].known ? 1 : 0;
                return aK - bK;
            });

                var item = obj.item;

                    '</div>' +

        function markWord(btn, known) {

        // ===== MODE: QUIZ =====
        function renderQuiz(grid, data, lvl) {
            var questions = shuffle(data.slice());
            var qIdx = 0;
            var score = 0;
            var total = questions.length;

            function showQuestion() {
                if (qIdx >= total) {
                    var pct = Math.round(score / total * 100);
                    var emoji = pct >= 80 ? '\u2B50' : pct >= 50 ? '\u{1F44D}' : '\u{1F4AA}';
                    grid.innerHTML = '<div class="quiz-area"><div class="quiz-card quiz-result">' +
                        '<div class="score-label">' + emoji + ' Ergebnis</div>' +
                        '<div class="score-big">' + score + '/' + total + '</div>' +
                        '<div class="score-label">' + pct + '% richtig</div>' +
                        '<button class="retry-btn" onclick="renderVocab()">Nochmal \u{1F504}</button>' +
                    '</div></div>';
                    return;
                }
                var q = questions[qIdx];
                var opts = getRandomOptions(q[1], data, 4);
                grid.innerHTML = '<div class="quiz-area">' +
                    '<div class="quiz-progress">Frage ' + (qIdx + 1) + ' / ' + total + ' \u00b7 Richtig: ' + score + '</div>' +
                    '<div class="quiz-card">' +
                        '<div class="quiz-word">' + q[0] + '</div>' +
                        '<div class="quiz-hint">' + q[2] + '</div>' +
                        '<div class="quiz-opts">' + opts.map(function(o) {
                            return '<button class="quiz-opt" data-answer="' + o.replace(/"/g, '&quot;') + '">' + o + '</button>';
                        }).join('') + '</div>' +
                    '</div></div>';
            }
            showQuestion();

            grid.onclick = function(e) {
                var opt = e.target.closest('.quiz-opt');
                if (!opt || opt.classList.contains('disabled')) return;
                var correct = questions[qIdx][1];
                var answer = opt.dataset.answer;
                // Disable all
                grid.querySelectorAll('.quiz-opt').forEach(function(o) { o.classList.add('disabled'); });
                var isOk = stripHtml(answer) === stripHtml(correct);
                if (isOk) {
                    opt.classList.add('correct');
                    score++;
                } else {
                    opt.classList.add('wrong');
                    grid.querySelectorAll('.quiz-opt').forEach(function(o) {
                        if (stripHtml(o.dataset.answer) === stripHtml(correct)) o.classList.add('correct');
                    });
                }
                recordLeitner(currentLevel, currentTopic, questions[qIdx], isOk);
                qIdx++;
                setTimeout(showQuestion, 800);
            };

        // ===== MODE: MATCH =====
        function renderMatch(grid, data) {
            var pairs = shuffle(data.slice()).slice(0, 6);
            var leftItems = shuffle(pairs.map(function(p, i) { return { text: p[0], idx: i, side: 'left' }; }));
            var rightItems = shuffle(pairs.map(function(p, i) { return { text: p[1], idx: i, side: 'right' }; }));
            var matched = 0;
            var selected = null;

            function render() {
                grid.innerHTML = '<div class="match-grid">' +
                    '<div class="match-col">' + leftItems.map(function(it) {
                        return '<div class="match-item' + (it.done ? ' correct' : '') + '" data-side="left" data-idx="' + it.idx + '">' + it.text + '</div>';
                    }).join('') + '</div>' +
                    '<div class="match-col">' + rightItems.map(function(it) {
                        return '<div class="match-item' + (it.done ? ' correct' : '') + '" data-side="right" data-idx="' + it.idx + '">' + it.text + '</div>';
                    }).join('') + '</div>' +
                '</div>' +
                '<div class="match-score">' + matched + ' / ' + pairs.length + ' Paare</div>';
            }
            render();

            grid.onclick = function(e) {
                var item = e.target.closest('.match-item');
                if (!item || item.classList.contains('correct')) return;

                if (!selected) {
                    selected = { side: item.dataset.side, idx: parseInt(item.dataset.idx), el: item };
                    item.classList.add('selected');
                } else {
                    if (selected.side === item.dataset.side) {
                        selected.el.classList.remove('selected');
                        selected = { side: item.dataset.side, idx: parseInt(item.dataset.idx), el: item };
                        item.classList.add('selected');
                        return;
                    }
                    var idx1 = selected.idx;
                    var idx2 = parseInt(item.dataset.idx);
                    if (idx1 === idx2) {
                        // Correct match
                        matched++;
                        leftItems.forEach(function(it) { if (it.idx === idx1) it.done = true; });
                        rightItems.forEach(function(it) { if (it.idx === idx1) it.done = true; });
                        selected = null;
                        render();
                        if (matched === pairs.length) {
                            grid.innerHTML += '<div style="text-align:center;margin-top:1.5rem;">' +
                                '<div style="font-size:2rem;">\u{1F389}</div>' +
                                '<div style="color:#3fb950;font-weight:600;margin:0.5rem 0;">Alle Paare gefunden!</div>' +
                                '<button class="retry-btn" onclick="renderVocab()">Nochmal \u{1F504}</button></div>';
                        }
                    } else {
                        // Wrong
                        item.classList.add('wrong');
                        selected.el.classList.add('wrong');
                        var oldSel = selected;
                        selected = null;
                        setTimeout(function() {
                            item.classList.remove('wrong', 'selected');
                            oldSel.el.classList.remove('wrong', 'selected');
                        }, 500);
                    }
                }
            };
        }

        function renderType(grid, data, lvl) {

                    return;
                }
                var q = items[idx];
                grid.innerHTML = '<div class="type-area">' +
                    '<div class="quiz-progress">Wort ' + (idx + 1) + ' / ' + items.length + ' \u00b7 Richtig: ' + score + '</div>' +
                    '<div class="type-card">' +
                        '<div class="type-word">' + q[0] + '</div>' +
                        '<div class="type-explain">' + q[2] + '</div>' +
                        '<div class="type-row">' +
                            '<input class="type-input" id="type-ans" placeholder="\u043f\u0435\u0440\u0435\u0432\u043e\u0434..." autocomplete="off">' +
                            '<button class="type-check" id="type-btn">Pr\u00fcfen</button>' +
                        '</div>' +
                        '<div class="type-feedback" id="type-fb"></div>' +
                        '<div class="type-nav" id="type-nav" style="display:none"><button class="type-next" id="type-next">Weiter \u2192</button></div>' +
                    '</div></div>';
                document.getElementById('type-ans').focus();
            }

            function check() {
                var inp = document.getElementById('type-ans');
                var fb = document.getElementById('type-fb');
                var val = inp.value.trim().toLowerCase();
                var correct = stripHtml(items[idx][1]).toLowerCase();
                // Accept any comma-separated part
                var parts = correct.split(',').map(function(s) { return s.trim(); });
                var ok = parts.some(function(p) { return val === p || val === p.replace(/\s+/g, ' '); });
                if (ok) {
                    fb.textContent = '\u2705 Richtig!';
                    fb.className = 'type-feedback ok';
                    score++;
                } else {
                    fb.innerHTML = '\u274C Richtig w\u00e4re: <strong>' + items[idx][1] + '</strong>';
                    fb.className = 'type-feedback fail';
                }
                recordLeitner(currentLevel, currentTopic, items[idx], ok);
                inp.disabled = true;
                document.getElementById('type-btn').style.display = 'none';
                document.getElementById('type-nav').style.display = 'flex';
            }

            showWord();

            grid.onclick = function(e) {
                if (e.target.id === 'type-btn' || e.target.closest('#type-btn')) check();
                if (e.target.id === 'type-next' || e.target.closest('#type-next')) { idx++; showWord(); }
            };
            grid.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    if (!document.getElementById('type-ans').disabled) check();
                    else { idx++; showWord(); }
                }
            };
        }

        // ===== MODE: SPEED =====
        function renderSpeed(grid, data, lvl) {
            grid.innerHTML = '<div class="quiz-area" style="text-align:center;">' +
                '<div class="speed-timer-bar"><div class="speed-time">30</div><div class="speed-score-live">\u{1F3AF} Klicke Start!</div></div>' +
                '<button class="speed-start-btn" id="speed-go">Start \u{26A1}</button></div>';

            document.getElementById('speed-go').onclick = function() { startSpeedRound(grid, data, lvl); };
        }
        function startSpeedRound(grid, data, lvl) {
            var pool = shuffle(data.slice());
            var qIdx = 0;
            var score = 0;
            var timeLeft = 30;

            function showQ() {
                if (qIdx >= pool.length) qIdx = 0; // loop
                var q = pool[qIdx];
                var opts = getRandomOptions(q[1], data, 4);
                grid.innerHTML = '<div class="quiz-area">' +
                    '<div class="speed-timer-bar">' +
                        '<div class="speed-time' + (timeLeft <= 5 ? ' danger' : '') + '">' + timeLeft + '</div>' +
                        '<div class="speed-score-live">\u{1F3AF} ' + score + ' richtig</div>' +
                    '</div>' +
                    '<div class="quiz-card">' +
                        '<div class="quiz-word">' + q[0] + '</div>' +
                        '<div class="quiz-opts">' + opts.map(function(o) {
                            return '<button class="quiz-opt" data-answer="' + o.replace(/"/g, '&quot;') + '">' + o + '</button>';
                        }).join('') + '</div>' +
                    '</div></div>';
            }

            showQ();
            speedTimer = setInterval(function() {
                timeLeft--;
                var timeEl = grid.querySelector('.speed-time');
                if (timeEl) {
                    timeEl.textContent = timeLeft;
                    if (timeLeft <= 5) timeEl.classList.add('danger');
                }
                if (timeLeft <= 0) {
                    clearInterval(speedTimer);
                    speedTimer = null;
                    var emoji = score >= 10 ? '\u{1F525}' : score >= 5 ? '\u{1F44D}' : '\u{1F4AA}';
                    grid.innerHTML = '<div class="quiz-area"><div class="quiz-card quiz-result">' +
                        '<div class="score-label">' + emoji + ' Speed-Ergebnis</div>' +
                        '<div class="score-big">' + score + '</div>' +
                        '<div class="score-label">in 30 Sekunden</div>' +
                        '<button class="retry-btn" onclick="renderVocab()">Nochmal \u{26A1}</button>' +
                    '</div></div>';
                }
            }, 1000);

            grid.onclick = function(e) {
                var opt = e.target.closest('.quiz-opt');
                if (!opt || !speedTimer) return;
                var correct = pool[qIdx][1];
                if (stripHtml(opt.dataset.answer) === stripHtml(correct)) {
                    score++;
                    qIdx++;
                    showQ();
                } else {
                    opt.classList.add('wrong');
                    setTimeout(function() { opt.classList.remove('wrong'); }, 300);
                }
            };
        }

        // ===== MODE: DESCRIBE (Guess by explanation) =====
        function renderDescribe(grid, data, lvl) {

            function showQ() {
                if (idx >= total) {
                    var pct = Math.round(score / total * 100);
                    grid.innerHTML = '<div class="quiz-area"><div class="quiz-card quiz-result">' +
                        '<div class="score-label">\u{1F575}\uFE0F Ergebnis</div>' +

                var q = items[idx];
                // 4 options: correct word + 3 random words
                var opts = [q[0]];

        // ===== MODE: BLANK (Fill the gap) =====
        function renderBlank(grid, data, lvl) {
            var items = shuffle(data.filter(function(d) { return d[3] && d[3].length > 10; })).slice(0, 12);
            if (!items.length) items = shuffle(data.slice()).slice(0, 12);
            var idx = 0, score = 0, total = items.length;

            function showQ() {
                if (idx >= total) {
                    var pct = Math.round(score / total * 100);
                    grid.innerHTML = '<div class="quiz-area"><div class="quiz-card quiz-result">' +
                        '<div class="score-label">\u{1F4AC} Ergebnis</div>' +
                        '<div class="score-big">' + score + '/' + total + '</div>' +
                        '<div class="score-label">' + pct + '% richtig</div>' +
                        '<button class="retry-btn" onclick="renderVocab()">Nochmal \u{1F504}</button></div></div>';
                    return;
                }
                var q = items[idx];
                var word = stripHtml(q[0]);
                var sentence = stripHtml(q[3]);
                // Find the word or part of it in the sentence
                var parts = word.split(/\s+/);
                var mainWord = parts[parts.length - 1]; // last word (e.g. from "sich schämen" take "schämen")
                var blanked = sentence;
                var found = false;
                // Try to find the main word in the sentence (case-insensitive)
                var regex = new RegExp('(' + mainWord.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[a-z\u00e4\u00f6\u00fc\u00df]*)', 'i');
                if (regex.test(sentence)) {
                    blanked = sentence.replace(regex, '<span class="blank-gap">______</span>');
                    found = true;
                }
                if (!found) blanked = sentence.replace(/([\w\u00e4\u00f6\u00fc\u00df]{4,})/i, '<span class="blank-gap">______</span>');

                // Options: correct + 3 wrong
                var opts = [word];
                var pool = shuffle(data.filter(function(d) { return d[0] !== q[0]; }));
                for (var i = 0; i < 3 && i < pool.length; i++) opts.push(stripHtml(pool[i][0]));
                opts = shuffle(opts);

                grid.innerHTML = '<div class="quiz-area">' +
                    '<div class="quiz-progress">Frage ' + (idx + 1) + ' / ' + total + ' \u00b7 Richtig: ' + score + '</div>' +
                    '<div class="quiz-card">' +
                        '<div style="font-size:0.78rem;color:var(--color-text-muted);margin-bottom:0.5rem;">\u{1F4AC} F\u00fclle die L\u00fccke:</div>' +
                        '<div class="blank-sentence">\u00ab' + blanked + '\u00bb</div>' +
                        '<div class="quiz-opts">' + opts.map(function(o) {
                            return '<button class="quiz-opt" data-answer="' + o.replace(/"/g,'&quot;') + '">' + o + '</button>';
                        }).join('') + '</div>' +
                    '</div></div>';
            }
            showQ();

            grid.onclick = function(e) {
                var opt = e.target.closest('.quiz-opt');
                if (!opt || opt.classList.contains('disabled')) return;
                var correct = stripHtml(items[idx][0]);
                grid.querySelectorAll('.quiz-opt').forEach(function(o) { o.classList.add('disabled'); });
                var isOk = opt.dataset.answer === correct;
                if (isOk) { opt.classList.add('correct'); score++; }
                else {
                    opt.classList.add('wrong');
                    grid.querySelectorAll('.quiz-opt').forEach(function(o) { if (o.dataset.answer === correct) o.classList.add('correct'); });
                }
                recordLeitner(currentLevel, currentTopic, items[idx], isOk);
                idx++;
                setTimeout(showQ, 900);
            };
        }

        function renderSurvival(grid, data, lvl) {

                '<div style="color:#fff;font-weight:600;font-size:1.1rem;">Survival Mode</div>' +

            document.getElementById('surv-go').onclick = function() { startSurvival(grid, data, lvl); };
        }
        function startSurvival(grid, data, lvl) {
            var pool = shuffle(data.slice());
            var lives = 3, streak = 0, best = 0, qIdx = 0;

            function showQ() {
                if (qIdx >= pool.length) qIdx = 0;
                var q = pool[qIdx];
                var opts = getRandomOptions(q[1], data, 4);
                var heartsHtml = '';
                for (var i = 0; i < 3; i++) heartsHtml += (i < lives) ? '\u2764\uFE0F' : '\u{1F5A4}';

                grid.innerHTML = '<div class="quiz-area">' +
                    '<div style="text-align:center;">' +
                        '<div class="lives">' + heartsHtml + '</div>' +
                        '<div class="survival-streak">\u{1F525} Streak: ' + streak + '</div>' +
                    '</div>' +
                    '<div class="quiz-card" style="margin-top:1rem;">' +
                        '<div class="quiz-word">' + q[0] + '</div>' +
                        '<div class="quiz-opts">' + opts.map(function(o) {
                            return '<button class="quiz-opt" data-answer="' + o.replace(/"/g,'&quot;') + '">' + o + '</button>';
                        }).join('') + '</div>' +
                    '</div></div>';
            }

            function gameOver() {
                var emoji = streak >= 10 ? '\u{1F525}' : streak >= 5 ? '\u{1F4AA}' : '\u{1F914}';
                grid.innerHTML = '<div class="quiz-area"><div class="quiz-card quiz-result">' +
                    '<div class="score-label">' + emoji + ' Game Over</div>' +
                    '<div class="score-big">' + streak + '</div>' +
                    '<div class="score-label">Streak</div>' +
                    '<button class="retry-btn" onclick="renderVocab()">Nochmal \u{1F525}</button></div></div>';
            }

            showQ();
            grid.onclick = function(e) {
                var opt = e.target.closest('.quiz-opt');
                if (!opt || opt.classList.contains('disabled')) return;
                var correct = pool[qIdx][1];
                grid.querySelectorAll('.quiz-opt').forEach(function(o) { o.classList.add('disabled'); });
                if (stripHtml(opt.dataset.answer) === stripHtml(correct)) {
                    opt.classList.add('correct');
                    recordLeitner(currentLevel, currentTopic, pool[qIdx], true);
                    streak++;
                    qIdx++;
                    setTimeout(showQ, 500);
                } else {
                    opt.classList.add('wrong');
                    grid.querySelectorAll('.quiz-opt').forEach(function(o) { if (stripHtml(o.dataset.answer) === stripHtml(correct)) o.classList.add('correct'); });
                    recordLeitner(currentLevel, currentTopic, pool[qIdx], false);
                    lives--;
                    if (lives <= 0) { setTimeout(gameOver, 800); }
                    else { qIdx++; setTimeout(showQ, 800); }
                }
            };
        }

        // ===== MODE: SENTENCE BUILD =====
        function renderSentence(grid, data, lvl) {
            var items = shuffle(data.filter(function(d) { return d[3] && stripHtml(d[3]).split(/\s+/).length >= 5; })).slice(0, 8);
            if (!items.length) items = shuffle(data.slice()).slice(0, 8);
            var idx = 0, score = 0, total = items.length;
            var placed = [];
            var words = [];

            function showQ() {
                if (idx >= total) {
                    var pct = Math.round(score / total * 100);
                    grid.innerHTML = '<div class="quiz-area"><div class="quiz-card quiz-result">' +
                        '<div class="score-label">\u{1F4D6} Ergebnis</div>' +
                        '<div class="score-big">' + score + '/' + total + '</div>' +
                        '<div class="score-label">' + pct + '% richtig</div>' +
                        '<button class="retry-btn" onclick="renderVocab()">Nochmal \u{1F504}</button></div></div>';
                    return;
                }
                var q = items[idx];
                var sentence = stripHtml(q[3]);
                words = sentence.split(/\s+/);
                placed = [];
                var shuffled = shuffle(words.slice());

                renderSentenceUI(shuffled, q);
            }

            function renderSentenceUI(shuffled, q) {
                grid.innerHTML = '<div class="quiz-area">' +
                    '<div class="quiz-progress">Satz ' + (idx + 1) + ' / ' + total + ' \u00b7 Richtig: ' + score + '</div>' +
                    '<div class="quiz-card">' +
                        '<div style="font-size:0.78rem;color:var(--color-text-muted);margin-bottom:0.3rem;">\u{1F4D6} Ordne die W\u00f6rter:</div>' +
                        '<div class="quiz-word" style="font-size:1.1rem;">' + q[0] + ' &mdash; ' + q[1] + '</div>' +
                        '<div class="sentence-result" id="sent-result">' +
                            placed.map(function(w, i) { return '<span class="sentence-placed" data-pi="' + i + '">' + w + '</span>'; }).join('') +
                            (placed.length === 0 ? '<span style="color:var(--color-text-muted);font-size:0.82rem;">Klicke W\u00f6rter in der richtigen Reihenfolge</span>' : '') +
                        '</div>' +
                        '<div class="sentence-bank" id="sent-bank">' +
                            shuffled.map(function(w, i) {
                                var isUsed = false;
                                var usedCount = placed.filter(function(p) { return p === w; }).length;
                                var totalCount = shuffled.slice(0, i + 1).filter(function(s) { return s === w; }).length;
                                if (usedCount >= totalCount) isUsed = true;
                                return '<span class="sentence-chip' + (isUsed ? ' used' : '') + '" data-wi="' + i + '">' + w + '</span>';
                            }).join('') +
                        '</div>' +
                        '<div id="sent-fb" class="type-feedback" style="text-align:center;"></div>' +
                    '</div></div>';
            }

            showQ();
            var shuffledRef = [];

            grid.onclick = function(e) {
                // Click on chip to add to result
                var chip = e.target.closest('.sentence-chip');
                if (chip && !chip.classList.contains('used')) {
                    placed.push(chip.textContent);
                    var q = items[idx];
                    var sentence = stripHtml(q[3]);
                    var currentWords = sentence.split(/\s+/);
                    // Get shuffled order from current DOM
                    var allChips = Array.from(grid.querySelectorAll('.sentence-chip'));
                    var shuffled = allChips.map(function(c) { return c.textContent; });
                    renderSentenceUI(shuffled, q);

                    // Auto-check when all words placed
                    if (placed.length === currentWords.length) {
                        var fb = document.getElementById('sent-fb');
                        if (placed.join(' ') === currentWords.join(' ')) {
                            fb.textContent = '\u2705 Richtig!';
                            fb.className = 'type-feedback ok';
                            score++;
                        } else {
                            fb.innerHTML = '\u274C Richtig: <em>' + sentence + '</em>';
                            fb.className = 'type-feedback fail';
                        }
                        idx++;
                        setTimeout(showQ, 1500);
                    }
                }
                // Click on placed word to remove it
                var placedEl = e.target.closest('.sentence-placed');
                if (placedEl) {
                    var pi = parseInt(placedEl.dataset.pi);
                    placed.splice(pi, 1);
                    var q = items[idx];
                    var allChips = Array.from(grid.querySelectorAll('.sentence-chip'));
                    var shuffled = allChips.map(function(c) { return c.textContent; });
                    renderSentenceUI(shuffled, q);
                }
            };
        }

        // ===== MODE: STORY (Mini-Text mit Tap-to-Translate) =====
        function renderStory(grid, data, lvl) {
            if (data.length < 4) {
                grid.innerHTML = '<div class="quiz-area"><div class="quiz-card" style="text-align:center;padding:2rem;"><div style="color:var(--color-text-muted);">\u0414\u043b\u044f \u0446\u0456\u0454\u0457 \u0442\u0435\u043c\u0438 \u043c\u0430\u043b\u043e \u0441\u043b\u0456\u0432 \u0434\u043b\u044f \u0442\u0435\u043a\u0441\u0442\u0443.</div></div></div>';
                return;
            }
            var count = Math.min(7, data.length);
            var picks = shuffle(data.slice()).slice(0, count);
            var sentences = picks.map(function(p, i) {
                var sent = stripHtml(p[3] || '');
                if (!sent) return '';
                var word = stripHtml(p[0]);
                var parts = word.split(/\s+/);
                var mainWord = parts[parts.length - 1];
                var regex = new RegExp('(' + mainWord.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[a-z\u00e4\u00f6\u00fc\u00df]{0,})', 'i');
                var wrapped = sent;
                if (regex.test(sent)) {
                    wrapped = sent.replace(regex, '<span class="story-word" data-pi="' + i + '">$1</span>');
                } else {
                    wrapped = '<span class="story-word" data-pi="' + i + '">' + word + '</span>: ' + sent;
                }
                return '<div class="story-sentence">' + wrapped + '</div>';
            }).join('');

            var qCount = Math.min(3, picks.length);
            var qs = shuffle(picks.slice()).slice(0, qCount);
            var qHtml = qs.map(function(q, qi) {
                var opts = [stripHtml(q[0])];
                var pool = shuffle(picks.filter(function(p) { return stripHtml(p[0]) !== stripHtml(q[0]); }));
                for (var i = 0; i < 3 && i < pool.length; i++) opts.push(stripHtml(pool[i][0]));
                // Add extras from full data if not enough picks
                if (opts.length < 4) {
                    var extra = shuffle(data.filter(function(d) { return opts.indexOf(stripHtml(d[0])) === -1; }));
                    for (var j = 0; j < extra.length && opts.length < 4; j++) opts.push(stripHtml(extra[j][0]));
                }
                opts = shuffle(opts);
                return '<div class="quiz-card" style="margin-bottom:0.8rem;">' +
                    '<div style="font-size:0.78rem;color:var(--color-text-muted);margin-bottom:0.4rem;">\u2753 Welches Wort bedeutet:</div>' +
                    '<div style="font-weight:600;font-size:1rem;color:#fff;margin-bottom:0.9rem;">\u00ab' + q[1] + '\u00bb</div>' +
                    '<div class="quiz-opts" data-qi="' + qi + '" data-correct="' + stripHtml(q[0]).replace(/"/g,'&quot;') + '">' +
                        opts.map(function(o) { return '<button class="quiz-opt" data-answer="' + o.replace(/"/g,'&quot;') + '">' + o + '</button>'; }).join('') +
                    '</div>' +
                '</div>';
            }).join('');

            grid.innerHTML = '<div class="quiz-area">' +
                '<div class="story-card">' +
                    '<div class="story-title">\u{1F4D6} Mini-Text &mdash; ' + (TOPIC_META[currentTopic] ? TOPIC_META[currentTopic].title : currentTopic) + '</div>' +
                    sentences +
                    '<div style="font-size:0.75rem;color:var(--color-text-muted);margin-top:0.8rem;">\u{1F4A1} \u0422\u0430\u043f\u043d\u0438 \u043d\u0430 \u0432\u0438\u0434\u0456\u043b\u0435\u043d\u0435 \u0441\u043b\u043e\u0432\u043e, \u0449\u043e\u0431 \u043f\u043e\u0431\u0430\u0447\u0438\u0442\u0438 \u043f\u0435\u0440\u0435\u043a\u043b\u0430\u0434</div>' +
                '</div>' +
                qHtml +
            '</div>';

            grid.onclick = function(e) {
                var sw = e.target.closest('.story-word');
                if (sw) {
                    var pi = parseInt(sw.dataset.pi);
                    var item = picks[pi];
                    var oldPop = document.querySelector('.story-pop');
                    if (oldPop) oldPop.remove();
                    if (sw.classList.contains('revealed')) {
                        sw.classList.remove('revealed');
                        return;
                    }
                    sw.classList.add('revealed');
                    var pop = document.createElement('div');
                    pop.className = 'story-pop';
                    pop.innerHTML = '<strong>' + item[1] + '</strong><span>' + item[2] + '</span>';
                    document.body.appendChild(pop);
                    var rect = sw.getBoundingClientRect();
                    pop.style.top = (rect.bottom + window.scrollY + 6) + 'px';
                    pop.style.left = Math.max(10, Math.min(window.innerWidth - 300, rect.left + window.scrollX)) + 'px';
                    setTimeout(function() { if (pop.parentNode) pop.remove(); }, 4000);
                    return;
                }
                var opt = e.target.closest('.quiz-opt');
                if (!opt) return;
                var optsWrap = opt.parentElement;
                if (optsWrap.classList.contains('done')) return;
                optsWrap.classList.add('done');
                var correct = optsWrap.dataset.correct;
                optsWrap.querySelectorAll('.quiz-opt').forEach(function(o) { o.classList.add('disabled'); });
                var qi = parseInt(optsWrap.dataset.qi);
                var q = qs[qi];
                var ok = stripHtml(opt.dataset.answer) === stripHtml(correct);
                if (ok) opt.classList.add('correct');
                else {
                    opt.classList.add('wrong');
                    optsWrap.querySelectorAll('.quiz-opt').forEach(function(o) { if (stripHtml(o.dataset.answer) === stripHtml(correct)) o.classList.add('correct'); });
                }
                recordLeitner(currentLevel, currentTopic, q, ok);
            };
        }

        // ===== MODE: BILDER (Emoji-Assoziation) =====
        function renderBilder(grid, data, lvl) {
            var items = shuffle(data.slice());
            var total = Math.min(items.length, 12);
            items = items.slice(0, total);
            var idx = 0, score = 0;

            function showQ() {
                if (idx >= total) {
                    var pct = Math.round(score / total * 100);
                    grid.innerHTML = '<div class="quiz-area"><div class="quiz-card quiz-result">' +
                        '<div class="score-label">\u{1F3A8} Ergebnis</div>' +
                        '<div class="score-big">' + score + '/' + total + '</div>' +
                        '<div class="score-label">' + pct + '% richtig</div>' +
                        '<button class="retry-btn" onclick="renderVocab()">Nochmal \u{1F504}</button></div></div>';
                    return;
                }
                var q = items[idx];
                var emojiStr = getEmojiFor(q);
                var opts = [stripHtml(q[0])];
                var pool = shuffle(data.filter(function(d) { return stripHtml(d[0]) !== stripHtml(q[0]); }));
                for (var i = 0; i < 3 && i < pool.length; i++) opts.push(stripHtml(pool[i][0]));
                opts = shuffle(opts);

                grid.innerHTML = '<div class="quiz-area">' +
                    '<div class="quiz-progress">Frage ' + (idx + 1) + ' / ' + total + ' \u00b7 Richtig: ' + score + '</div>' +
                    '<div class="bilder-emoji-box">' +
                        '<div class="bilder-emoji">' + emojiStr + '</div>' +
                        '<div class="bilder-hint">\u{1F3A8} Welches Wort passt zum Bild?</div>' +
                    '</div>' +
                    '<div class="quiz-card">' +
                        '<div class="quiz-opts">' + opts.map(function(o) {
                            return '<button class="quiz-opt" data-answer="' + o.replace(/"/g,'&quot;') + '">' + o + '</button>';
                        }).join('') + '</div>' +
                    '</div></div>';
            }
            showQ();

            grid.onclick = function(e) {
                var opt = e.target.closest('.quiz-opt');
                if (!opt || opt.classList.contains('disabled')) return;
                var correct = stripHtml(items[idx][0]);
                var ok = stripHtml(opt.dataset.answer) === correct;
                grid.querySelectorAll('.quiz-opt').forEach(function(o) { o.classList.add('disabled'); });
                if (ok) { opt.classList.add('correct'); score++; }
                else {
                    opt.classList.add('wrong');
                    grid.querySelectorAll('.quiz-opt').forEach(function(o) { if (stripHtml(o.dataset.answer) === correct) o.classList.add('correct'); });
                }
                recordLeitner(currentLevel, currentTopic, items[idx], ok);
                idx++;
                setTimeout(showQ, 900);
            };
        }

        // ===== EVENT LISTENERS =====

        function switchTopicPills(level) {
            var reg = document.getElementById('regular-topics');
            var syn = document.getElementById('syn-topics');
            var koll = document.getElementById('koll-topics');
            [reg, syn, koll].forEach(function(el) { el.style.display = 'none'; });
            var active = level === 'syn' ? syn : level === 'koll' ? koll : reg;
            active.style.display = '';
            active.querySelectorAll('.topic-pill').forEach(function(p) { p.classList.remove('active'); });
            var first = active.querySelector('.topic-pill');
            if (first) { first.classList.add('active'); currentTopic = first.dataset.topic; }
        }

        // Level buttons
        document.querySelectorAll('.level-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.level-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentLevel = btn.dataset.level;
                switchTopicPills(currentLevel);
                renderVocab();
            });
        });

        // Topic pills
        document.querySelectorAll('.topic-pill').forEach(function(pill) {
            pill.addEventListener('click', function() {
                var container = pill.closest('#regular-topics') || pill.closest('#syn-topics') || pill.closest('#koll-topics');
                container.querySelectorAll('.topic-pill').forEach(function(p) { p.classList.remove('active'); });
                pill.classList.add('active');
                currentTopic = pill.dataset.topic;
                renderVocab();
            });
        });

        // Mode buttons
        document.querySelectorAll('.mode-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                renderVocab();
            });
        });

        // Flashcard flip (delegated, only in cards mode)
        document.addEventListener('click', function(e) {
            if (currentMode !== 'cards') return;
            var card = e.target.closest('.vocab-card');
            if (card && !e.target.closest('.card-action-btn')) card.classList.toggle('flipped');
        });

        // Initial render
        renderVocab();
    </script>
</body>
</html>
